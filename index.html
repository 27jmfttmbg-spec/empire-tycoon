</style></head><body><div id="app"></div><nav id="nav" class="tabbar"></nav><div id="overlay"></div><div id="toast"></div><script>
(()=>{'use strict';
const CATALOG=[{id:'lawn',name:'Lawn Care',icon:'🌿',cost:2500,base:2100,expense:700,cap:90,staff:3},{id:'wash',name:'Car Wash',icon:'🚙',cost:14500,base:6500,expense:2800,cap:85,staff:6},{id:'coffee',name:'Coffee Shop',icon:'☕',cost:48000,base:15500,expense:7800,cap:80,staff:9},{id:'gym',name:'Fitness Club',icon:'🏋️',cost:125000,base:37000,expense:20500,cap:75,staff:15},{id:'restaurant',name:'Restaurant',icon:'🍽️',cost:325000,base:95000,expense:57000,cap:75,staff:22},{id:'software',name:'Software Studio',icon:'💻',cost:850000,base:225000,expense:120000,cap:65,staff:35},{id:'factory',name:'Manufacturing',icon:'🏭',cost:2400000,base:600000,expense:380000,cap:65,staff:65},{id:'hotel',name:'Luxury Hotel',icon:'🏨',cost:7500000,base:1850000,expense:1190000,cap:60,staff:100},{id:'bank',name:'Investment Bank',icon:'🏦',cost:25000000,base:5900000,expense:3700000,cap:55,staff:140}];
const PROPS=[{id:'condo',name:'City Apartment',icon:'🏢',price:95000,rent:850},{id:'duplex',name:'Duplex',icon:'🏘️',price:380000,rent:3300},{id:'office',name:'Office Tower',icon:'🏙️',price:2700000,rent:25000},{id:'resort',name:'Beach Resort',icon:'🏝️',price:16000000,rent:150000}];
const CARS=[{id:'civic',name:'Sport Sedan',brand:'Aster',price:28000,upkeep:320,img:'photo-1552519507-da3b142c6e3d',class:'Everyday'},{id:'bmw',name:'M Performance Coupe',brand:'Bavarian',price:85000,upkeep:790,img:'photo-1555215695-3004980ad54e',class:'Sport'},{id:'porsche',name:'911 GT',brand:'Stuttgart',price:185000,upkeep:1450,img:'photo-1503376780353-7e6692767b70',class:'Supercar'},{id:'lambo',name:'Italian V12',brand:'Toro',price:425000,upkeep:3200,img:'photo-1544829099-b9a0c07fad1a',class:'Exotic'},{id:'ferrari',name:'Grand Touring V8',brand:'Cavallo',price:550000,upkeep:4100,img:'photo-1592198084033-aade902d1aae',class:'Exotic'},{id:'rolls',name:'Ultra-Luxury Saloon',brand:'Regent',price:690000,upkeep:4900,img:'photo-1631295868223-63265b40d9e4',class:'Luxury'}];
const PROPERTY_IMAGES={condo:'photo-1600585154340-be6161a56a0c',duplex:'photo-1600596542815-ffad4c1539a9',office:'photo-1486406146926-c627a92ad1ab',resort:'photo-1571896349842-33c89424de2d'};
const BUSINESS_IMAGES={lawn:'photo-1416879595882-3373a0480b5b',wash:'photo-1552930294-6b595f4c2974',coffee:'photo-1445116572660-236099ec97a0',gym:'photo-1534438327276-14e5300c3a48',restaurant:'photo-1517248135467-4c7edcad34c4',software:'photo-1497366811353-6870744d04b2',factory:'photo-1565043589221-1a6fd9ae45c7',hotel:'photo-1566073771259-6a8506099945',bank:'photo-1486406146926-c627a92ad1ab'};
const photo=(id,w=960)=>'https://images.unsplash.com/'+id+'?auto=format&fit=crop&w='+w+'&q=78';
const scene=(id,title,tag='')=>`<div class="scene" style="background-image:linear-gradient(180deg,transparent 42%,#06101ce8 100%),url('${photo(id)}')"><div class="scene-label"><div class="scene-tag">${tag}</div><strong>${title}</strong></div></div>`;
const STOCKS=[{id:'tech',name:'NOVA Technologies',ticker:'NOVA',price:120,vol:.14},{id:'retail',name:'MERIDIAN Retail',ticker:'MRDN',price:56,vol:.08},{id:'energy',name:'VOLT Energy',ticker:'VOLT',price:82,vol:.12},{id:'fund',name:'Atlas Index Fund',ticker:'ATLS',price:250,vol:.05}];
const RIVALS=[{id:'alpha',name:'Apex Group',industry:'Retail & Services',value:280000,share:16},{id:'nova',name:'Northstar Capital',industry:'Technology',value:1800000,share:22},{id:'titan',name:'Titan Industries',industry:'Manufacturing',value:11000000,share:28}];
const KEY='empire_deep_v1';let state,tab='city',assetSection='property',citySelected=-1,modal=null,toastTimer=null;
const fresh=()=>({month:1,cash:15000,debt:0,credit:690,rate:.095,market:1,inflation:.025,cycle:'Expansion',reputation:50,businesses:[],properties:[],cars:[],stocks:{},prices:Object.fromEntries(STOCKS.map(x=>[x.id,x.price])),rivals:RIVALS.map(x=>({...x,owned:false})),history:[15000],reports:[],events:[{month:1,text:'Your holding company is founded. Your first $15,000 is ready to invest.'}],lastReport:null});
try{state=JSON.parse(localStorage.getItem(KEY))||fresh();if(!state.businesses||!state.prices)throw 0}catch(e){state=fresh()}
state.cars=Array.isArray(state.cars)?state.cars:[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const $=n=>{if(!isFinite(n))return '$0';const a=Math.abs(n),s=n<0?'−':'';return s+'$'+(a>=1e9?(a/1e9).toFixed(2)+'B':a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e4?(a/1e3).toFixed(1)+'K':a.toLocaleString('en-US',{maximumFractionDigits:0}))};
const pct=n=>(n*100).toFixed(1)+'%';const fmt=n=>Math.round(n).toLocaleString();const byId=id=>CATALOG.find(x=>x.id===id);const assetValue=()=>state.businesses.reduce((a,b)=>a+byId(b.id).cost*b.level*(1+b.brand*.012),0)+state.properties.reduce((a,p)=>a+p.value,0)+state.cars.reduce((a,c)=>a+c.value,0)+Object.keys(state.stocks).reduce((a,id)=>a+(state.stocks[id]||0)*state.prices[id],0)+state.rivals.filter(x=>x.owned).reduce((a,r)=>a+r.value,0);const worth=()=>state.cash+assetValue()-state.debt;
const businessCalc=(b)=>{const c=byId(b.id);const workers=b.workers;const capacity=Math.min(1,workers/(c.staff*b.level));const demand=Math.max(.25,Math.min(1.3,state.market*(1-(b.price-1)*.75)*(1+b.brand*.015)));const rev=c.base*b.level*capacity*demand*b.price*(1+b.marketing*.045);const wages=workers*(c.expense/c.staff)*.48*(1+state.inflation);const fixed=c.expense*b.level*.52*(1+state.inflation);const marketing=b.marketing*c.base*.035*b.level;const cost=wages+fixed+marketing;return{rev,cost,profit:rev-cost,capacity,demand};};
const forecast=()=>{let rev=0,exp=0;state.businesses.forEach(b=>{const x=businessCalc(b);rev+=x.rev;exp+=x.cost});const rent=state.properties.reduce((a,p)=>a+p.rent*(p.occupancy?1:0),0);const rival=state.rivals.filter(x=>x.owned).reduce((a,r)=>a+r.value*.012*state.market,0);const interest=state.debt*state.rate/12;const garage=state.cars.reduce((a,c)=>a+c.upkeep,0);return{rev:rev+rent+rival,exp:exp+interest+garage,profit:rev+rent+rival-exp-interest-garage,interest,rent,rival,garage}};
function notify(msg){const el=document.getElementById('toast');el.innerHTML='<div class="toast">'+msg+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.innerHTML='',2900)}
function action(fn){try{fn();save();render()}catch(e){console.error(e);notify('Something went wrong. Try again.')}}
function log(msg){state.events.unshift({month:state.month,text:msg});state.events=state.events.slice(0,35)}
function buyBiz(id){action(()=>{const c=byId(id);if(state.cash<c.cost)return notify('Not enough cash to acquire this business');state.cash-=c.cost;const found=state.businesses.find(x=>x.id===id);if(found){found.level++;found.workers+=c.staff;log('Expanded '+c.name+' to '+found.level+' locations.')}else{state.businesses.push({id,level:1,workers:c.staff,price:1,marketing:0,brand:0});log('Acquired '+c.name+' for '+$(c.cost)+'.')}state.reputation=Math.min(100,state.reputation+2);notify(c.name+' acquired!')})}
function updateBiz(id,field,delta){action(()=>{const b=state.businesses.find(x=>x.id===id);const c=byId(id);if(!b)return;if(field==='workers'){const next=b.workers+delta;if(next<0||next>c.staff*b.level*2)return;const hiring=delta>0?delta*850:0;if(state.cash<hiring)return notify('Not enough cash for hiring costs');state.cash-=hiring;b.workers=next}else if(field==='price')b.price=Math.max(.6,Math.min(1.8,Math.round((b.price+delta)*100)/100));else if(field==='marketing')b.marketing=Math.max(0,Math.min(5,b.marketing+delta));else if(field==='brand'){const cost=c.cost*.15*(b.brand+1);if(state.cash<cost)return notify('Not enough cash for brand investment');state.cash-=cost;b.brand++}log(c.name+' management updated.')})}
function takeLoan(amount){action(()=>{const max=Math.max(0,Math.round((Math.max(25000,assetValue()*.55)-state.debt)/1000)*1000);if(amount>max||amount<=0)return notify('Loan exceeds your credit limit');state.cash+=amount;state.debt+=amount;state.credit=Math.max(300,state.credit-8);log('Borrowed '+$(amount)+' at '+pct(state.rate)+' APR.');modal=null;notify('Loan funded')})}
function repay(amount){action(()=>{amount=Math.min(amount,state.debt,state.cash);if(amount<=0)return notify('No available funds to repay');state.cash-=amount;state.debt-=amount;state.credit=Math.min(850,state.credit+5);log('Repaid '+$(amount)+' in principal.');modal=null})}
function buyProp(id){action(()=>{const p=PROPS.find(x=>x.id===id);if(state.cash<p.price)return notify('Not enough cash for this property');state.cash-=p.price;state.properties.push({...p,value:p.price,occupancy:true});log('Purchased '+p.name+' for '+$(p.price)+'.');notify('Property acquired')})}
function buyCar(id){action(()=>{const c=CARS.find(x=>x.id===id);if(!c)return;if(state.cash<c.price)return notify('Not enough cash to buy this car');state.cash-=c.price;state.cars.push({...c,uid:Date.now()+'-'+Math.random(),value:c.price,age:0});log('Added '+c.brand+' '+c.name+' to your garage for '+$(c.price)+'.');notify('New car added to your collection!')})}
function sellCar(uid){action(()=>{const i=state.cars.findIndex(c=>c.uid===uid);if(i<0)return;const c=state.cars.splice(i,1)[0];state.cash+=c.value;log('Sold '+c.name+' for '+$(c.value)+'.');notify('Vehicle sold')})}
function sellProp(i){action(()=>{const p=state.properties[i];if(!p)return;state.cash+=p.value;state.properties.splice(i,1);log('Sold '+p.name+' for '+$(p.value)+'.');notify('Property sold')})}
function trade(id,qty){action(()=>{qty=Math.trunc(qty);if(!qty)return;const cost=qty*state.prices[id];if(qty>0&&cost>state.cash)return notify('Insufficient cash');if(qty<0&&-qty>(state.stocks[id]||0))return notify('Insufficient shares');state.cash-=cost;state.stocks[id]=(state.stocks[id]||0)+qty;log((qty>0?'Bought ':'Sold ')+Math.abs(qty)+' shares of '+id.toUpperCase()+'.');modal=null})}
function acquireRival(id){action(()=>{const r=state.rivals.find(x=>x.id===id);if(r.owned)return;const price=Math.round(r.value*1.2);if(state.cash<price)return notify('Insufficient cash for acquisition');state.cash-=price;r.owned=true;state.reputation=Math.min(100,state.reputation+10);log('Completed hostile takeover of '+r.name+' for '+$(price)+'.');notify('Merger complete!')})}
function advance(){action(()=>{const f=forecast();let event='';const dice=Math.random();if(dice<.12){state.market=Math.max(.55,state.market-.08);event='Consumer confidence drops. Demand weakens.'}else if(dice<.24){state.market=Math.min(1.3,state.market+.07);event='Consumer spending surges. Businesses see stronger demand.'}else{state.market=Math.max(.65,Math.min(1.25,state.market+(Math.random()-.5)*.055))}state.cycle=state.market<.78?'Recession':state.market>1.12?'Boom':'Expansion';state.inflation=Math.max(.005,Math.min(.085,state.inflation+(Math.random()-.5)*.007));state.rate=Math.max(.045,Math.min(.19,state.rate+(Math.random()-.5)*.007));state.month++;state.cars.forEach(c=>{c.age++;c.value=Math.max(c.price*.35,c.value*(1-(c.class==='Exotic'?.003:.009)))});let revenue=0,expenses=0;state.businesses.forEach(b=>{const v=businessCalc(b);const swing=.91+Math.random()*.18;revenue+=v.rev*swing;expenses+=v.cost});const rent=state.properties.reduce((a,p)=>{p.value*=1+(Math.random()-.42)*.02;p.occupancy=Math.random()>.055;return a+(p.occupancy?p.rent:0)},0);const rivalIncome=state.rivals.filter(r=>r.owned).reduce((a,r)=>a+r.value*.012*state.market,0);state.rivals.forEach(r=>{r.value*=1+(Math.random()-.45)*.045;if(!r.owned)r.share=Math.max(5,Math.min(45,r.share+(Math.random()-.5)*3))});STOCKS.forEach(s=>{state.prices[s.id]=Math.max(1,state.prices[s.id]*(1+(Math.random()-.46)*s.vol+(state.market-1)*.018))});const interest=state.debt*state.rate/12;const principal=Math.min(state.debt,state.debt*.012);state.debt-=principal;const garage=state.cars.reduce((a,c)=>a+c.upkeep,0);const profit=revenue+rent+rivalIncome-expenses-interest-principal-garage;state.cash+=profit;state.credit=Math.max(300,Math.min(850,state.credit+(profit>0?1:-3)));state.lastReport={month:state.month,revenue:revenue+rent+rivalIncome,expenses:expenses+interest+principal+garage,profit,interest,principal,rent,rivalIncome,garage};state.reports.unshift(state.lastReport);state.reports=state.reports.slice(0,24);state.history.push(Math.max(0,worth()));state.history=state.history.slice(-18);log('Month '+state.month+' closed: '+(profit>=0?'+':'')+$(profit)+' cash flow.');if(event)log(event);if(state.cash<0){log('WARNING: Negative cash balance. Sell assets or refinance to avoid insolvency.');notify('Warning: your cash balance is negative')}else notify('Month '+state.month+' complete · '+$(profit)+' cash flow');tab='city'})}
function reset(){if(confirm('Start a completely new empire? This permanently erases your current save.')){state=fresh();tab='overview';modal=null;save();render()}}
const h=(title,right='')=>`<div class="section"><h2>${title}</h2><small>${right}</small></div>`;
const btn=(label,onclick,kind='')=>`<button class="btn ${kind}" onclick="${onclick}">${label}</button>`;
function chart(){const hist=state.history;const lo=Math.min(...hist),hi=Math.max(...hist);return `<div class="chart">${hist.map(n=>`<div class="bar" style="height:${Math.max(8,((n-lo)/(hi-lo||1))*85+10)}%"></div>`).join('')}</div><div class="row sub" style="margin-top:7px"><span>Month ${Math.max(1,state.month-hist.length+1)}</span><span>Month ${state.month}</span></div>`}
function overview(){const f=forecast();return `<div class="hero"><div class="eyebrow">Total net worth · Month ${state.month}</div><div class="money"><small>$</small>${$(worth()).slice(1)}</div><div class="row"><span class="pill">${state.cycle} economy</span><span class="pill">Credit ${state.credit}</span></div><div class="hero-foot"><div><span class="eyebrow">Cash on hand</span><strong>${$(state.cash)}</strong></div><div><span class="eyebrow">Monthly cash flow</span><strong class="${f.profit>=0?'pos':'neg'}">${$(f.profit)}</strong></div><div><span class="eyebrow">Total debt</span><strong>${$(state.debt)}</strong></div></div></div>${h('Financial overview','Projected / month')}<div class="grid"><div class="card"><div class="eyebrow">Revenue</div><div class="value pos">${$(f.rev)}</div><small>Business + investment income</small></div><div class="card"><div class="eyebrow">Expenses</div><div class="value">${$(f.exp)}</div><small>Operating costs + interest</small></div><div class="card"><div class="eyebrow">Assets</div><div class="value">${$(assetValue())}</div><small>Portfolio market value</small></div><div class="card"><div class="eyebrow">Profit margin</div><div class="value ${f.profit>=0?'pos':'neg'}">${f.rev?pct(f.profit/f.rev):'—'}</div><small>Projected operating margin</small></div></div>${h('Empire growth','Net worth history')}<div class="card">${chart()}</div>${h('Economic climate')}<div class="card"><div class="row"><div><strong>${state.cycle}</strong><div class="sub">Consumer demand index</div></div><strong class="${state.market>=1?'pos':'neg'}">${Math.round(state.market*100)} / 100</strong></div><div class="meter"><i style="width:${Math.min(100,state.market/1.3*100)}%"></i></div><div class="divider"></div><div class="row sub"><span>Inflation <b>${pct(state.inflation)}</b></span><span>Borrowing APR <b>${pct(state.rate)}</b></span></div></div>${h('Your empire',state.businesses.length+' industries')}<div class="card"><div class="row"><span>🏢 Operating locations</span><strong>${state.businesses.reduce((a,b)=>a+b.level,0)}</strong></div><div class="divider"></div><div class="row"><span>👥 Employees</span><strong>${state.businesses.reduce((a,b)=>a+b.workers,0)}</strong></div><div class="divider"></div><div class="row"><span>🏘️ Properties</span><strong>${state.properties.length}</strong></div><div class="divider"></div><div class="row"><span>🏎️ Cars</span><strong>${state.cars.length}</strong></div><div class="divider"></div><div class="row"><span>🤝 Acquired competitors</span><strong>${state.rivals.filter(r=>r.owned).length}</strong></div></div>${h('Latest developments')}<div class="card">${state.events.slice(0,5).map(e=>`<div class="feed"><strong>M${e.month}</strong> · ${e.text}</div>`).join('')}</div><button class="btn primary wide advance" onclick="game.advance()">⏩ &nbsp; Advance one month</button>`}
function businessCard(b){const c=byId(b.id),v=businessCalc(b),target=c.staff*b.level;return `<div class="business">${scene(BUSINESS_IMAGES[b.id],c.name,'YOUR BUSINESS')}<div class="biz-head" style="margin-top:12px"><div class="emoji">${c.icon}</div><div style="flex:1;min-width:0"><div class="biz-name">${c.name}</div><div class="sub">${b.level} location${b.level>1?'s':''} · ${b.workers} employees</div></div><span class="pill">${pct(v.capacity)} staffed</span></div><div class="biz-stats"><div><span class="eyebrow">Revenue</span><strong>${$(v.rev)}</strong></div><div><span class="eyebrow">Expenses</span><strong>${$(v.cost)}</strong></div><div><span class="eyebrow">Profit</span><strong class="${v.profit>=0?'pos':'neg'}">${$(v.profit)}</strong></div></div><div class="meter"><i style="width:${v.capacity*100}%"></i></div><div class="sub" style="margin-top:10px">Pricing: ${pct(b.price)} of base · Marketing: ${b.marketing}/5 · Brand: ${b.brand}</div><div class="actions">${btn('Manage','game.manage(\''+b.id+'\')','primary')}${btn('Expand · '+$(c.cost),'game.buyBiz(\''+b.id+'\')')}</div></div>`}
function businesses(){return `<h1 class="titleline">Businesses</h1><div class="hint">Build companies with real operating costs. Hiring, pricing and advertising change profitability.</div>${h('Your companies',state.businesses.length+' owned')}${state.businesses.length?state.businesses.map(businessCard).join(''):'<div class="empty card">No businesses yet. Acquire your first company below.</div>'}${h('Acquire a business','Purchase price')}${CATALOG.filter(c=>!state.businesses.some(b=>b.id===c.id)).map(c=>`<div class="listitem"><div class="row"><div class="emoji">${c.icon}</div><div><strong>${c.name}</strong><small>Base revenue ${$(c.base)}/mo · ${c.staff} staff</small></div></div>${btn($(c.cost),'game.buyBiz(\''+c.id+'\')','primary')}</div>`).join('')}`}
function investments(){return `<h1 class="titleline">The Exchange</h1><div class="hint">Trade simulated companies. Prices respond to the economic cycle and change each month.</div>${h('Your portfolio',$(Object.keys(state.stocks).reduce((a,id)=>a+(state.stocks[id]||0)*state.prices[id],0)))}<div class="stock-hero"><div class="eyebrow">MARKET WATCH · SIMULATED</div><div class="stock-wave">▁▂▃▂▄▅▄▆▅▇▆█</div><strong>${state.cycle} Market</strong><span>Demand index ${Math.round(state.market*100)}</span></div>${STOCKS.map(s=>{const owned=state.stocks[s.id]||0;return `<div class="asset-row"><div class="stock-symbol">${s.ticker.slice(0,2)}</div><div style="flex:1"><strong>${s.name}</strong><div class="sub">${s.ticker} · ${owned} shares held</div></div><div style="text-align:right"><strong>${$(state.prices[s.id])}</strong><div class="sub">${$(owned*state.prices[s.id])} owned</div></div></div><div class="actions" style="margin:0 0 18px 56px">${btn('Buy','game.tradeModal(\''+s.id+'\',1)','primary')}${btn('Sell','game.tradeModal(\''+s.id+'\',-1)')}</div>`}).join('')}`}
function cityIso(x,y,w,h,depth,kind,color,idx,label){const x2=x+w,y2=y-h,top=`${x},${y-h} ${x+depth},${y-h-depth*.43} ${x+w+depth},${y-h-depth*.43} ${x+w},${y-h}`,side=`${x+w},${y-h} ${x+w+depth},${y-h-depth*.43} ${x+w+depth},${y-depth*.43} ${x+w},${y}`,front=`${x},${y-h} ${x+w},${y-h} ${x+w},${y} ${x},${y}`;let windows='';for(let a=0;a<Math.max(1,Math.floor(h/20));a++){for(let b=0;b<Math.max(1,Math.floor(w/19));b++){const wx=x+8+b*18,wy=y-h+11+a*19;if(wx<x+w-4&&wy<y-7)windows+=`<rect class="building-window ${((a+b+idx)%4===0)?'dim':''}" x="${wx}" y="${wy}" width="8" height="9" rx="1"/>`}}return `<g class="lot" role="button" tabindex="0" aria-label="Open ${label}" onclick="game.citySelect(${idx})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();game.citySelect(${idx})}"><ellipse cx="${x+w/2+10}" cy="${y+9}" rx="${w*.85}" ry="13" fill="#000" opacity=".24"/><polygon class="ground" points="${x-9},${y+4} ${x+depth},${y-depth*.43-8} ${x+w+depth+9},${y-depth*.43+3} ${x+w},${y+12}" fill="#395e50"/><polygon points="${side}" fill="${color}" opacity=".68"/><polygon points="${front}" fill="${color}"/><polygon points="${top}" fill="#b1d1cf" opacity=".8"/>${windows}${kind==='property'?`<polygon points="${x-5},${y-h+1} ${x+w/2+depth/2},${y-h-24} ${x+w+depth+5},${y-h-depth*.43+1} ${x+w},${y-h-depth*.43+8} ${x+w/2},${y-h-15} ${x},${y-h+8}" fill="#e5a67a"/>`:''}<rect x="${x+w/2-23}" y="${y+10}" width="65" height="19" rx="8" fill="#091823" opacity=".9"/><text x="${x+w/2+9}" y="${y+23}" text-anchor="middle" fill="#e9f8ff" font-size="10" font-weight="bold">${kind==='property'?'HOME':'BIZ'} ${idx+1}</text></g>`}
function city(){const buildings=[...state.businesses.map((b,i)=>({kind:'business',name:byId(b.id).name,ref:i,id:b.id,level:b.level})),...state.properties.map((p,i)=>({kind:'property',name:p.name,ref:i,id:p.id,level:1}))];const selected=buildings[citySelected]||null;const positions=[[56,195],[205,171],[355,201],[90,320],[270,328],[425,325],[65,446],[222,461],[391,456],[125,565],[325,563],[50,660],[225,660],[410,657]];const art=positions.map(([x,y],i)=>{const b=buildings[i];if(!b)return `<g opacity=".48"><polygon points="${x-10},${y+2} ${x+24},${y-18} ${x+92},${y-2} ${x+56},${y+18}" fill="#47695e" stroke="#77978a" stroke-dasharray="5 4"/><text x="${x+36}" y="${y-1}" text-anchor="middle" fill="#b1d5c4" font-size="11">OPEN LOT</text></g>`;const isProp=b.kind==='property';const h=isProp?45+(b.id==='office'?70:b.id==='resort'?36:0):48+Math.min(100,b.level*19)+(b.id==='bank'||b.id==='hotel'?45:0);return cityIso(x,y,55,h,23,b.kind,isProp?'#af7867': ['#557f9d','#647c9d','#548c86','#806e9b'][i%4],i,b.name)}).join('');let details='';if(selected){if(selected.kind==='business'){const b=state.businesses[selected.ref],v=businessCalc(b);details=`<div class="city-detail"><div class="eyebrow">CITY BUSINESS · ${b.level} LOCATION${b.level===1?'':'S'}</div><h3>${selected.name}</h3><div class="city-info"><div><small>Monthly revenue</small><strong>${$(v.rev)}</strong></div><div><small>Operating profit</small><strong class="${v.profit>=0?'pos':'neg'}">${$(v.profit)}</strong></div></div><div class="city-cta">${btn('Manage business',`game.manage('${b.id}')`,'primary')}${btn('Expand · '+$(byId(b.id).cost),`game.buyBiz('${b.id}')`)}</div></div>`}else{const p=state.properties[selected.ref];details=`<div class="city-detail"><div class="eyebrow">OWNED REAL ESTATE</div><h3>${p.name}</h3><div class="city-info"><div><small>Market value</small><strong>${$(p.value)}</strong></div><div><small>Monthly rent</small><strong class="pos">${$(p.occupancy?p.rent:0)}</strong></div></div><div class="city-cta">${btn('View property',"game.assetOpen('property')",'primary')}${btn('Sell · '+$(p.value),`game.sellProp(${selected.ref})`)}</div></div>`}}return `<div class="page-heading"><div><div class="eyebrow">V3 · LIVING EMPIRE</div><h1 class="titleline">Your City</h1></div><span class="pill">Month ${state.month}</span></div><div class="city-banner"><div class="eyebrow">YOUR PERSONAL SKYLINE</div><div class="value">${buildings.length} buildings · ${$(worth())} net worth</div><div class="sub" style="margin-top:6px">Every company and property you buy becomes a building. Tap a building to manage it.</div></div><div class="city-stage"><svg viewBox="0 0 560 730" role="img" aria-label="Interactive isometric city of owned businesses and properties"><defs><linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#264c59"/><stop offset="1" stop-color="#1b343a"/></linearGradient></defs><rect width="560" height="730" fill="url(#water)"/><path d="M0 100 L560 190 M0 235 L560 320 M0 385 L560 475 M0 540 L560 625" stroke="#20343e" stroke-width="29"/><path d="M0 100 L560 190 M0 235 L560 320 M0 385 L560 475 M0 540 L560 625" class="roadmark"/><path d="M155 0 L220 730 M375 0 L430 730" stroke="#20343e" stroke-width="26"/><path d="M155 0 L220 730 M375 0 L430 730" class="roadmark"/>${art}<text x="280" y="29" text-anchor="middle" fill="#d4e7ed" font-size="13" letter-spacing="5">EMPIRE DISTRICT</text></svg></div><div class="city-legend"><span class="city-chip">🏢 ${state.businesses.length} businesses</span><span class="city-chip">🏡 ${state.properties.length} properties</span><span class="city-chip">💵 ${$(forecast().profit)} / mo forecast</span></div>${details||'<div class="city-empty">Tap a building to see its finances and management options. Empty lots fill as you expand your empire.</div>'}<div class="city-cta">${btn('Buy businesses',"game.tab('businesses')",'primary')}${btn('Buy property',"game.assetOpen('property')")}</div><div class="hint" style="margin-top:16px">City buildings are stylized illustrations. Property and car photo galleries are available in Assets.</div>`}
function assets(){const propWorth=state.properties.reduce((a,p)=>a+p.value,0),carWorth=state.cars.reduce((a,c)=>a+c.value,0);return `<div class="page-heading"><div><div class="eyebrow">THE COLLECTION</div><h1 class="titleline">Your Assets</h1></div><span class="pill">${state.properties.length+state.cars.length} owned</span></div><div class="grid"><div class="card"><div class="eyebrow">Real estate</div><div class="value">${$(propWorth)}</div><small>${state.properties.length} properties</small></div><div class="card"><div class="eyebrow">Car collection</div><div class="value">${$(carWorth)}</div><small>${state.cars.length} vehicles</small></div></div><div class="switch"><button class="btn ${assetSection==='property'?'selected':''}" onclick="game.assetSection('property')">🏡 Properties</button><button class="btn ${assetSection==='cars'?'selected':''}" onclick="game.assetSection('cars')">🏎️ Garage</button></div>${assetSection==='property'?propertyGallery():carGallery()}`}

function carGallery(){return `${h('Your garage',state.cars.length+' vehicles')}${state.cars.length?state.cars.map(c=>`<div class="showcase">${scene(c.img,c.brand+' '+c.name,'YOUR COLLECTION')}<div class="showcase-info"><div class="row"><div><div class="eyebrow">ESTIMATED VALUE</div><div class="value">${$(c.value)}</div></div>${btn('Sell','game.sellCar(\''+c.uid+'\')')}</div><div class="sub">Ownership cost ${$(c.upkeep)}/month · ${c.age} months owned</div></div></div>`).join(''):'<div class="empty card">Your garage is empty. Buy a car to see it in your collection.</div>'}${h('Luxury showroom','Build your collection')}${CARS.map(c=>`<div class="showcase">${scene(c.img,c.brand+' '+c.name,c.class.toUpperCase())}<div class="showcase-info"><div class="row"><div><div class="eyebrow">SHOWROOM PRICE</div><div class="value">${$(c.price)}</div></div>${btn('Buy car','game.buyCar(\''+c.id+'\')','primary')}</div><div class="sub">Insurance, servicing & storage: ${$(c.upkeep)}/month · Vehicle depreciates over time</div></div></div>`).join('')}`}

function finance(){const f=forecast(),limit=Math.max(0,Math.round((Math.max(25000,assetValue()*.55)-state.debt)/1000)*1000);return `<h1 class="titleline">Finance</h1><div class="hint">Manage leverage, borrowing costs and the monthly profit and loss statement.</div>${h('Banking')}<div class="grid"><div class="card"><div class="eyebrow">Cash balance</div><div class="value">${$(state.cash)}</div></div><div class="card"><div class="eyebrow">Debt outstanding</div><div class="value">${$(state.debt)}</div></div><div class="card"><div class="eyebrow">Borrowing APR</div><div class="value">${pct(state.rate)}</div></div><div class="card"><div class="eyebrow">Credit score</div><div class="value">${state.credit}</div></div></div><div class="card" style="margin-top:10px"><div class="row"><div><strong>Available credit</strong><div class="sub">Collateral-based borrowing limit</div></div><strong>${$(limit)}</strong></div><div class="actions">${btn('Apply for loan','game.loanModal()','primary')}${btn('Repay debt','game.repayModal()')}</div></div>${h('Monthly P&L','Projected')}<div class="card"><div class="listitem"><span>Business and asset revenue</span><strong class="pos">${$(f.rev)}</strong></div><div class="listitem"><span>Operating expenses</span><strong class="neg">−${$(f.exp-f.interest)}</strong></div><div class="listitem"><span>Debt interest</span><strong class="neg">−${$(f.interest)}</strong></div><div class="listitem"><strong>Net operating cash flow</strong><strong class="${f.profit>=0?'pos':'neg'}">${$(f.profit)}</strong></div></div>${h('Financial reports','Last '+state.reports.length+' months')}${state.reports.length?state.reports.slice(0,8).map(r=>`<div class="listitem"><div><strong>Month ${r.month}</strong><small>Revenue ${$(r.revenue)} · Costs ${$(r.expenses)}</small></div><strong class="${r.profit>=0?'pos':'neg'}">${$(r.profit)}</strong></div>`).join(''):'<div class="empty card">Advance one month to generate your first financial report.</div>'}${h('Game settings')}<div class="card"><div class="sub">Your empire saves automatically on this device.</div><div class="actions">${btn('Restart game','game.reset()','danger')}</div></div>`}
function manage(id){const b=state.businesses.find(x=>x.id===id),c=byId(id);modal=`<h2>${c.icon} ${c.name}</h2><p>Make operational decisions. Changes immediately affect projected monthly profitability.</p><div class="listitem"><div><strong>Employees</strong><small>${b.workers} hired · ${c.staff*b.level} fully staffed · $850 hiring fee</small></div><div>${btn('−','game.updateBiz(\''+id+'\',\'workers\',-1)')}${btn('+','game.updateBiz(\''+id+'\',\'workers\',1)','primary')}</div></div><div class="listitem"><div><strong>Customer pricing</strong><small>${pct(b.price)} of standard · Higher prices can reduce demand</small></div><div>${btn('−','game.updateBiz(\''+id+'\',\'price\',-.05)')}${btn('+','game.updateBiz(\''+id+'\',\'price\',.05)','primary')}</div></div><div class="listitem"><div><strong>Advertising</strong><small>Level ${b.marketing}/5 · Boosts revenue but adds expenses</small></div><div>${btn('−','game.updateBiz(\''+id+'\',\'marketing\',-1)')}${btn('+','game.updateBiz(\''+id+'\',\'marketing\',1)','primary')}</div></div><div class="listitem"><div><strong>Brand development</strong><small>Level ${b.brand} · Permanent demand improvement</small></div>${btn('Invest '+$(c.cost*.15*(b.brand+1)),'game.updateBiz(\''+id+'\',\'brand\',1)','primary')}</div>`;render()}
function tradeModal(id,sign){const s=STOCKS.find(x=>x.id===id);modal=`<h2>${sign>0?'Buy':'Sell'} ${s.ticker}</h2><p>Current share price: ${$(state.prices[id])}. You own ${state.stocks[id]||0} shares.</p><input class="input" id="quantity" type="number" min="1" step="1" value="1" placeholder="Number of shares"><button class="btn primary wide" onclick="game.confirmTrade('${id}',${sign})">Confirm ${sign>0?'purchase':'sale'}</button>`;render()}
function loanModal(){const limit=Math.max(0,Math.round((Math.max(25000,assetValue()*.55)-state.debt)/1000)*1000);modal=`<h2>Business financing</h2><p>Borrow up to ${$(limit)} at a floating ${pct(state.rate)} annual rate. Interest accrues monthly and principal amortizes over time.</p><input class="input" id="quantity" type="number" min="1000" step="1000" value="${Math.min(10000,limit)}"><button class="btn primary wide" onclick="game.confirmLoan()">Accept financing</button>`;render()}
function repayModal(){modal=`<h2>Repay business debt</h2><p>Outstanding balance: ${$(state.debt)}. Paying down debt reduces future interest costs.</p><input class="input" id="quantity" type="number" min="1" value="${Math.round(Math.min(state.cash,state.debt))}"><button class="btn primary wide" onclick="game.confirmRepay()">Make payment</button>`;render()}
function render(){const views={overview,city,businesses,investments,assets,competition,finance};document.getElementById('app').innerHTML=`<header class="top"><div><div class="brand">EMPIRE<span>.</span></div><div class="eyebrow">Build wealth. Command markets.</div></div><button class="round" onclick="game.showHelp()">?</button></header>${views[tab]()}<div class="foot">EMPIRE TYCOON · DEEP ECONOMY EDITION</div>`;document.getElementById('nav').innerHTML=[['city','▥','City'],['overview','◈','Home'],['businesses','▦','Business'],['investments','◉','Stocks'],['assets','◈','Assets'],['competition','♜','Rivals'],['finance','▤','Finance']].map(([id,ic,name])=>`<button class="tab ${tab===id?'active':''}" onclick="game.tab('${id}')"><b>${ic}</b>${name}</button>`).join('');document.getElementById('overlay').innerHTML=modal?`<div class="modal-wrap" onclick="game.close()"><div class="modal" onclick="event.stopPropagation()"><div class="row" style="margin-bottom:12px"><span class="eyebrow">Management console</span><button class="round" onclick="game.close()">✕</button></div>${modal}</div></div>`:''}
window.game={citySelect:i=>{citySelected=i;render();document.querySelector('.city-detail')?.scrollIntoView({behavior:'smooth',block:'nearest'})},assetOpen:t=>{assetSection=t;tab='assets';render();window.scrollTo(0,0)},assetSection:t=>{assetSection=t;render()},buyCar,sellCar,sellProp,tab:t=>{tab=t;modal=null;render();window.scrollTo(0,0)},close:()=>{modal=null;render()},advance,buyBiz,updateBiz,manage,buyProp,tradeModal,acquireRival,loanModal,repayModal,reset,confirmTrade:(id,s)=>trade(id,s*Number(document.getElementById('quantity').value)),confirmLoan:()=>takeLoan(Number(document.getElementById('quantity').value)),confirmRepay:()=>repay(Number(document.getElementById('quantity').value)),showHelp:()=>{modal='<h2>Welcome to Empire Tycoon</h2><p>Inspired by the progression of business empire games, with deeper economic management. Start by acquiring a lawn care company or car wash. Adjust staffing, pricing and advertising to improve profitability. Advance one month to collect revenue and pay expenses. Invest in stocks, property and corporate takeovers. Use loans carefully: recessions can turn aggressive growth into a cash crisis.</p><p>Progress saves automatically in your browser. This is a standalone offline-capable simulation with fictional companies and simulated markets.</p>';render()}};
render();
})();
</script></body></html>

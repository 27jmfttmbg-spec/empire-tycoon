function updateBuildingState(p){const o=bases.get(p.id);if(o)o.rim.material.color.set(save.props[p.id].level?0x80e6b2:0xe4c483)}
const assetFiles={hotel:'hotel.glb',steakhouse:'steakhouse.glb',exchange:'exchange.glb',coffee:'coffee.glb',mansion:'mansion.glb'};const loader=new GLTFLoader();let finished=0;
function placeholder(p){const g=bases.get(p.id).g;const h=p.asset==='hotel'?58:p.asset==='exchange'?22:p.asset==='mansion'?12:p.asset==='steakhouse'?16:9;const w=p.asset==='hotel'?65:p.asset==='exchange'?85:p.asset==='mansion'?65:50;box(g,w,h,w*.8,mats.stone,0,h/2,0,true);box(g,w*.8,h*.65,w*.81,mats.glass,0,h*.53,0);box(g,w+2,1,w*.85,mats.dark,0,h+.5,0)}
async function loadAsset(name){return new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(new Error('Asset timeout')),11000);loader.load('models/'+assetFiles[name],g=>{clearTimeout(timeout);resolve(g.scene)},undefined,e=>{clearTimeout(timeout);reject(e)})})}
// Draw the city immediately, and never block gameplay on a failed asset request.
for(const p of properties)updateBuildingState(p);
Promise.allSettled(Object.keys(assetFiles).map(async name=>{try{const source=await loadAsset(name);assetCache.set(name,source);for(const p of properties.filter(q=>q.asset===name)){const g=source.clone(true);g.scale.setScalar(p.scale);g.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=true;o.userData.propertyId=p.id}});bases.get(p.id).g.add(g);objects.set(p.id,g);rayObjects.push(g)}}catch(e){console.warn('Asset unavailable:',name,e);for(const p of properties.filter(q=>q.asset===name))placeholder(p)}finally{finished++;$('loadfill').style.width=finished/5*100+'%';$('loadingText').textContent='Preparing architecture '+finished+' / 5'}})).then(()=>{hideLoading();if(finished===5&&assetCache.size<5)toast('Some 3D models were unavailable; backup buildings are visible.')});
function hideLoading(){$('loading').style.display='none'}setTimeout(hideLoading,9000);
// Clickable HTML labels project into the fixed camera, so they work even when a model fails.
const labelEls=new Map();for(const p of properties){const el=document.createElement('button');el.className='pin';el.setAttribute('aria-label','View '+p.name);el.onclick=()=>showProperty(p);$('labels').append(el);labelEls.set(p.id,el)}
const pos=new THREE.Vector3();function updateLabels(){for(const p of properties){const el=labelEls.get(p.id);if(!el)continue;const s=save.props[p.id];el.classList.toggle('owned',s.level>0);el.innerHTML='<b>'+p.name.replace(' · ','<br>')+'</b><small>'+(s.level?'LVL '+s.level+' · '+compact(rent(p))+'/MIN':'BUY '+compact(p.cost))+'</small>';const y=p.asset==='hotel'?103:p.asset==='exchange'?31:p.asset==='mansion'?17:p.asset==='steakhouse'?21:15;pos.set(p.x,y,p.z).project(camera);el.style.left=((pos.x+1)*.5*innerWidth)+'px';el.style.top=((-pos.y+1)*.5*innerHeight)+'px';el.style.display=Math.abs(pos.x)>1.04||Math.abs(pos.y)>1.04?'none':'block'}}
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let startX=0,startY=0;renderer.domElement.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY});renderer.domElement.addEventListener('pointerup',e=>{if(Math.hypot(e.clientX-startX,e.clientY-startY)>12)return;pointer.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(rayObjects,true)[0];if(hit){let obj=hit.object;while(obj&&!obj.userData.propertyId)obj=obj.parent;const p=properties.find(p=>p.id===obj?.userData.propertyId);if(p)showProperty(p)}});
// Deterministic traffic keeps the city alive without affecting the locked camera.
const traffic=[];function car(x,z,dir,color){const g=new THREE.Group();g.position.set(x,.55,z);g.rotation.y=dir;world.add(g);const paint=material(color,.25,.3);box(g,3,.8,6,paint,0,.5,0);box(g,2.4,.9,3,mats.glass,0,1.25,-.3);for(const sx of [-1.45,1.45])for(const sz of [-1.8,1.8]){const wheel=cyl(g,.62,.62,.32,mats.dark,sx,.3,sz,10);wheel.rotation.z=Math.PI/2}return g}for(let i=0;i<18;i++){const lane=i%3,x=lane===0?-305:lane===1?305:0;const g=car(x+(i%2?3:-3),-210+i*24,0,['#f6efe1','#182a38','#cb443b','#e6b35a'][i%4]);traffic.push({g,phase:i*31,speed:8+i*.3})}
// Autosave every tick, credit up to four hours of real offline income.
let last=Date.now();const offline=Math.min(Math.max(0,last-(save.last||last)),4*3600000);if(offline>15000&&perMin()>0){const bonus=perMin()*offline/60000;save.cash+=bonus;toast('WELCOME BACK · Offline earnings '+money(bonus))}save.last=last;refresh();persist();setInterval(()=>{const now=Date.now(),dt=Math.max(0,Math.min(now-last,4*3600000));last=now;const earned=perMin()*dt/60000;save.cash+=earned;save.lifetime=(save.lifetime||0)+earned;save.last=now;refresh();persist()},1000);addEventListener('pagehide',persist);addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')last=save.last||Date.now();else persist()});
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const t=clock.getElapsedTime();for(const v of traffic)v.g.position.z=((v.phase+t*v.speed+225)%450)-225;updateLabels();renderer.render(scene,camera)}frame();
</script></body></html>

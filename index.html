const $=id=>document.getElementById(id);const fmt=n=>'$'+Math.floor(n).toLocaleString('en-US');const key='empire_v12_vice_coast';let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}if(!state||!Array.isArray(state.plots))state={cash:65000,plots:[],last:Date.now()};
const scene=new THREE.Scene();scene.background=new THREE.Color('#8eb1ca');scene.fog=new THREE.Fog('#8eb1ca',230,550);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,850);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd7e8ff,0x3a5d61,2.15));const sun=new THREE.DirectionalLight(0xffcda5,2.8);sun.position.set(-90,130,45);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-240;sun.shadow.camera.right=240;sun.shadow.camera.top=240;sun.shadow.camera.bottom=-240;sun.shadow.normalBias=.035;scene.add(sun);
const mat=(c,rough=1,metal=0)=>new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal});
const turf=mat('#52796a'),asphalt=mat('#333940'),sidewalk=mat('#bcb7a8'),line=mat('#f2dfaa'),water=mat('#13778b',.19,.2),sand=mat('#d4b48c'),trunk=mat('#766047'),palmLeaf=mat('#2f6650'),glass=mat('#3a6b85',.16,.48),gold=mat('#d7af6e',.3,.3),concrete=mat('#a9adae'),dark=mat('#20272f'),neon=mat('#f45a98',.25),white=mat('#eee8dc');
function cube(parent,w,h,d,x,y,z,m,cast=true){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;parent.add(o);return o}
function cylinder(parent,rt,rb,h,x,y,z,m,n=8){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
const world=new THREE.Group();scene.add(world);
// Large playable peninsula: ocean east and south, with a continuous beachfront and yacht harbor.
cube(world,310,1,306,-20,-.75,-10,turf,false);
cube(world,280,.2,520,272,-.37,-15,water,false);
cube(world,700,.2,160,100,-.36,210,water,false);
cube(world,18,.14,305,146,-.06,-10,sand,false);
cube(world,307,.13,13,-20,-.04,145,sand,false);
const roads=[-120,-90,-60,-30,0,30,60,90,120];
for(const r of roads){cube(world,302,.08,8,-20,.04,r,asphalt,false);cube(world,8,.08,304,r,.045,-10,asphalt,false);for(let q=-160;q<=132;q+=12){cube(world,3,.014,.14,q,.09,r,line,false);cube(world,.14,.014,3,r,.09,q,line,false)}}
// Wide coastal highway, bridge and harbor boardwalk.
cube(world,11,.1,315,134,.1,-8,asphalt,false);cube(world,3,.2,315,143,.12,-8,sidewalk,false);
for(let q=-154;q<=146;q+=10)cube(world,.2,.018,3,134,.17,q,line,false);
cube(world,45,.35,10,167,.25,50,concrete,false);cube(world,55,.18,3,183,.25,49,sidewalk,false);
for(let q=0;q<8;q++){let z=-90+q*14;cube(world,23,.3,3,167,.16,z,mat('#7f7160'),false);cube(world,1.4,1.4,1.4,179,.8,z,white)}
function palm(x,z,s=1){const g=new THREE.Group();g.position.set(x,0,z);world.add(g);const stem=cylinder(g,.18*s,.34*s,5*s,0,2.5*s,0,trunk,7);stem.rotation.z=.06;for(let i=0;i<7;i++){const a=i*Math.PI*2/7;const f=new THREE.Mesh(new THREE.ConeGeometry(.78*s,4.6*s,4),palmLeaf);f.position.set(Math.sin(a)*1.6*s,5.15*s,Math.cos(a)*1.6*s);f.rotation.z=Math.cos(a)*1.15;f.rotation.x=-Math.sin(a)*1.15;g.add(f)}}
for(let z=-148;z<142;z+=11){palm(146,z,.8);palm(123,z,.65)}
for(let x=-155;x<130;x+=14)palm(x,143,.7);
function building(parent,type,level,waterfront=false){const g=new THREE.Group();parent.add(g);const h=type==='tower'?15+level*9:type==='apartment'?9+level*4:type==='shop'?4.5+level*1.2:6+level*2;const w=type==='tower'?8:type==='shop'?10:9;
const wall=mat(type==='tower'?'#b4c4c8':type==='apartment'?'#c8c6bc':type==='shop'?'#d7c6b2':'#ddd7c9',.65,.12);
cube(g,w,h,9,0,h/2,0,wall);cube(g,w+.7,.35,9.7,0,h+.2,0,dark);
if(type==='tower'){cube(g,w-1,h-.5,9.18,0,h/2,0,glass);for(let yy=3;yy<h;yy+=3.3)cube(g,w+.16,.12,9.4,0,yy,0,concrete,false);for(let xx=-w/2+2;xx<w/2;xx+=2.3)cube(g,.16,h,9.4,xx,h/2,0,concrete,false);cube(g,2,3,2,0,h+1.8,0,glass)}
else{for(let y=2.3;y<h-1;y+=2.6)for(let x=-w/2+1.3;x<w/2;x+=2.3){cube(g,1.5,1.5,.09,x,y,4.56,glass,false);cube(g,1.5,1.5,.09,x,y,-4.56,glass,false)}}
cube(g,2,2.5,.15,0,1.25,4.6,dark);if(type==='shop'){cube(g,10.6,.7,2.5,0,3.25,5.3,mat('#8e4d55'));cube(g,7,.48,.12,0,4.2,4.7,neon)}
if(type==='apartment'){for(let y=4;y<h;y+=4)cube(g,w+1,.18,2,0,y,5.3,concrete)}
if(waterfront){cube(g,9,.15,3,0,.1,6.4,sand,false)}
return g}
// Roadside developed blocks and purchasable lots; city spans over four times the previous playable area.
const plots=[];const positions=[-135,-105,-75,-45,-15,15,45,75,105];let id=0;
for(let ix=0;ix<9;ix++)for(let iz=0;iz<9;iz++){
const x=positions[ix],z=positions[iz];if((ix===4&&iz===4)||(ix===3&&iz===4)||(ix===4&&iz===3))continue;
const group=new THREE.Group();group.position.set(x,0,z);world.add(group);
const waterfront=ix>=7||iz>=7;const price=Math.round((9000+(ix+iz)*1300)*(waterfront?2.5:1));
const p={id:id++,x,z,price,waterfront,group,structure:null,base:null,outline:null};
p.base=cube(group,19,.15,19,0,.1,0,mat('#658f77'));
const edges=new THREE.EdgesGeometry(new THREE.BoxGeometry(19,.22,19));p.outline=new THREE.LineSegments(edges,new THREE.LineBasicMaterial({color:0x58c8a2}));p.outline.position.y=.14;group.add(p.outline);
const own=state.plots.find(a=>a.id===p.id);p.data=own||{id:p.id,owned:false,type:null,level:0};plots.push(p);
if(!own&&((ix+iz)%7===0||(ix===2&&iz===5)||(ix===5&&iz===2))){p.data.owned=true;p.data.type=['shop','apartment','tower'][(ix+iz)%3];p.data.level=1+(ix%3);state.plots.push(p.data)}
refreshPlot(p);
}
function refreshPlot(p){if(p.structure){p.group.remove(p.structure);p.structure=null}p.base.material=mat(p.data.owned?'#9b9276':'#6d927b');p.outline.material.color.set(p.data.owned?0xf7cf82:0x56bf91);if(p.data.type){p.structure=building(p.group,p.data.type,p.data.level,p.waterfront)}else if(p.data.owned){cube(p.group,3,.25,3,0,.26,0,gold)}}
for(let i=0;i<260;i++){const x=-158+Math.random()*295,z=-156+Math.random()*294;if(roads.some(r=>Math.abs(x-r)<5||Math.abs(z-r)<5))continue;if(plots.some(p=>Math.abs(x-p.x)<11&&Math.abs(z-p.z)<11))continue;palm(x,z,.42+Math.random()*.28)}
// Detailed low-poly luxury sportscars (original generic designs, not licensed Ferrari/McLaren models).
const traffic=[];function sportsCar(paint){const car=new THREE.Group();const body=mat(paint,.23,.55),rubber=mat('#14181e'),lights=mat('#f6f2da',.15);cube(car,2.35,.45,4.5,0,.58,0,body);cube(car,2.02,.45,2.1,0,.98,-.28,glass);cube(car,2.45,.15,.65,0,.54,-2.05,body);cube(car,2.45,.16,.55,0,.56,2.03,body);for(const x of [-1.19,1.19])for(const z of [-1.35,1.35]){const w=cylinder(car,.48,.48,.25,x,.43,z,rubber,12);w.rotation.z=Math.PI/2}for(const x of [-.75,.75])cube(car,.45,.15,.09,x,.62,2.28,lights,false);cube(car,2.4,.08,.28,0,.95,-2.05,dark);return car}
for(let i=0;i<34;i++){const road=roads[i%roads.length],horizontal=i%3===0;const car=sportsCar(['#e52b35','#f4a92b','#111923','#e5e7e8','#156b93','#e6c33f','#643b83'][i%7]);world.add(car);traffic.push({car,road,horizontal,speed:5+i*.17,t:i*17})}
// Waterfront supercars displayed beside a small luxury marina showroom.
const dealer=new THREE.Group();dealer.position.set(106,0,-137);world.add(dealer);cube(dealer,20,5,12,0,2.5,0,glass);cube(dealer,22,.55,14,0,5.3,0,dark);cube(dealer,12,.6,.2,0,4.2,6.2,neon);for(let i=0;i<3;i++){const c=sportsCar(['#f23a3e','#f7bd31','#dfe8ee'][i]);c.position.set(-7+i*7,0,9);c.rotation.y=Math.PI/2;dealer.add(c)}
let target=new THREE.Vector3(0,0,0),yaw=Math.PI/4,dist=175,elevation=.79;function updateCamera(){camera.position.set(target.x+Math.sin(yaw)*dist*Math.cos(elevation),dist*Math.sin(elevation),target.z+Math.cos(yaw)*dist*Math.cos(elevation));camera.lookAt(target.x,0,target.z)}updateCamera();const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let pointers=new Map(),start=null,pinch=0,selected=null;
function pointerPos(e){return {x:e.clientX,y:e.clientY}}renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);pointers.set(e.pointerId,pointerPos(e));if(pointers.size===1)start={x:e.clientX,y:e.clientY,moved:false};if(pointers.size===2){const a=[...pointers.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});renderer.domElement.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,pointerPos(e));if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch)dist=THREE.MathUtils.clamp(dist*pinch/d,28,350);pinch=d;if(start)start.moved=true;return}const dx=e.clientX-prev.x,dy=e.clientY-prev.y;if(start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>7)start.moved=true;const scale=dist*.0019;target.x=THREE.MathUtils.clamp(target.x+(-dx*Math.cos(yaw)+dy*Math.sin(yaw))*scale,-150,170);target.z=THREE.MathUtils.clamp(target.z+(dx*Math.sin(yaw)+dy*Math.cos(yaw))*scale,-150,160)});function end(e){if(start&&!start.moved&&pointers.size===1){mouse.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(plots.map(p=>p.group),true);if(hits.length){let o=hits[0].object;while(o.parent&&!plots.some(p=>p.group===o))o=o.parent;const p=plots.find(p=>p.group===o);if(p)showPlot(p)}}pointers.delete(e.pointerId);if(!pointers.size)start=null}renderer.domElement.addEventListener('pointerup',end);renderer.domElement.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);start=null});renderer.domElement.addEventListener('wheel',e=>{dist=THREE.MathUtils.clamp(dist+e.deltaY*.05,28,350)},{passive:true});
const costs={shop:20000,apartment:42000,tower:95000},rates={shop:28,apartment:70,tower:160};function income(){return plots.reduce((sum,p)=>sum+(p.data.type?rates[p.data.type]*p.data.level:0),0)}function save(){state.last=Date.now();localStorage.setItem(key,JSON.stringify(state))}function hud(){$('cash').textContent=fmt(state.cash);$('rate').textContent='+'+fmt(income())+'/sec';$('owned').textContent=plots.filter(p=>p.data.owned).length+' / '+plots.length}function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',2400)}function spend(amount){if(state.cash<amount){toast('Not enough cash. Your properties earn automatically.');return false}state.cash-=amount;return true}
function showPlot(p){selected=p;const d=p.data,s=$('sheet');let html=`<button class="x" id="close">×</button><h2>📍 Plot ${p.id+1}</h2>`;if(!d.owned){html+=`<p>${p.waterfront?"Premium waterfront":"City"} development lot. Purchase to unlock construction.</p><div class="row"><button class="buy" data-buy="land">Buy land · ${fmt(p.price)}</button></div>`}else if(!d.type){html+=`<p>You own this land. Choose what to construct; your building will appear directly on the plot.</p><div class="row">${Object.keys(costs).map(k=>`<button class="buy" data-build="${k}">${k==='shop'?'🏪 Shop':k==='apartment'?'🏘️ Apartments':'🏙️ Glass tower'}<br>${fmt(costs[k])}</button>`).join('')}</div>`}else{const c=Math.round(costs[d.type]*(1+d.level*.85));html+=`<p>${d.type.toUpperCase()} · Level ${d.level}<br>Income: <b style="color:#76ecaa">${fmt(rates[d.type]*d.level)}/sec</b><br>Upgrade the structure to visibly expand it and earn more.</p><div class="row"><button class="buy" data-upgrade="1">Upgrade · ${fmt(c)}</button><button class="buy secondary" data-demolish="1">Demolish</button></div>`}s.innerHTML=html;s.style.display='block';$('close').onclick=()=>s.style.display='none';s.querySelectorAll('[data-buy],[data-build],[data-upgrade],[data-demolish]').forEach(b=>b.onclick=()=>{if(b.dataset.buy){if(spend(p.price)){d.owned=true;state.plots.push(d)}}else if(b.dataset.build){const k=b.dataset.build;if(spend(costs[k])){d.type=k;d.level=1}}else if(b.dataset.upgrade){if(spend(Math.round(costs[d.type]*(1+d.level*.85))))d.level++}else if(b.dataset.demolish){d.type=null;d.level=0}refreshPlot(p);hud();save();showPlot(p)})}
$('zin').onclick=()=>dist=Math.max(28,dist*.78);$('zout').onclick=()=>dist=Math.min(350,dist*1.28);$('home').onclick=()=>{target.set(0,0,0);yaw=Math.PI/4;dist=175;$('sheet').style.display='none'};
const offline=Math.min(Math.max(0,(Date.now()-(state.last||Date.now()))/1000),8*3600);if(offline>5){const earned=offline*income()*.3;state.cash+=earned;setTimeout(()=>toast('Welcome back! Offline earnings: '+fmt(earned)),1200)}hud();save();let last=performance.now(),acc=0;function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.1);last=now;acc+=dt;for(const t of traffic){t.t+=dt*t.speed;const v=(t.t%320)-160;t.car.position.set(t.horizontal?v:t.road+(t.t%2?1.6:-1.6),0,t.horizontal?t.road+1.6:v);t.car.rotation.y=t.horizontal?Math.PI/2:0}if(acc>=.25){state.cash+=income()*acc;acc=0;hud()}updateCamera();renderer.render(scene,camera)}requestAnimationFrame(frame);setInterval(save,4000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});$('loading').remove();
</script><script>window.addEventListener('error',e=>{const el=document.getElementById('err');if(el){el.style.display='block';el.textContent='3D engine error: '+e.message+' — Please open in Safari with an internet connection.'}})</script></body></html>

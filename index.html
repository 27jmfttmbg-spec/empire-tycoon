<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101e2a"><title>Empire Tycoon — City Builder</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#80b9d3;color:white;touch-action:none}canvas{display:block;touch-action:none}#hud{position:absolute;inset:0;pointer-events:none}#top{position:absolute;top:env(safe-area-inset-top,12px);left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;align-items:start} .pill{background:#132f42e8;border:1px solid #ffffff36;border-radius:16px;padding:10px 13px;box-shadow:0 5px 15px #0003;backdrop-filter:blur(12px)}.small{font-size:10px;font-weight:900;letter-spacing:1.1px;color:#91e4ef}.money{font-weight:900;font-size:22px}.income{font-size:12px;color:#7ef2ad;font-weight:800}.right{text-align:right}#bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:12px;right:12px;display:flex;align-items:end;justify-content:space-between;gap:8px}.buttons{display:flex;flex-direction:column;gap:7px}.btn{pointer-events:auto;background:#18394ddf;border:1px solid #ffffff50;color:white;border-radius:13px;min-width:48px;min-height:46px;font-size:21px;font-weight:900;box-shadow:0 5px 10px #0004}.action{background:#f5b944;color:#24313d;font-size:13px;padding:0 15px}.info{font-size:12px;color:#cbe5ed;line-height:1.45;max-width:240px}#sheet{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 77px);background:#142d3cf5;border:1px solid #ffffff38;border-radius:20px;padding:16px;box-shadow:0 10px 40px #0007;pointer-events:auto;display:none;max-height:55vh;overflow:auto}#sheet h2{margin:0 0 6px;font-size:20px}#sheet p{margin:0 0 12px;color:#c5d9df;font-size:13px;line-height:1.4}.row{display:flex;gap:8px;flex-wrap:wrap}.buy{border:0;background:#ffca58;color:#182d39;padding:12px;border-radius:12px;font-weight:900;flex:1;min-width:105px}.buy.secondary{background:#35607a;color:white}.buy:disabled{opacity:.4}.x{float:right;background:none;border:0;color:white;font-size:24px}.hint{position:absolute;top:88px;left:50%;transform:translateX(-50%);padding:8px 12px;background:#143547c9;border-radius:100px;font-size:11px;font-weight:700;white-space:nowrap;pointer-events:none}#toast{position:absolute;top:135px;left:50%;transform:translateX(-50%);background:#102d39f0;padding:10px 15px;border-radius:12px;font-size:13px;display:none;pointer-events:none;max-width:85%;text-align:center}#loading{position:absolute;inset:0;background:#152e3c;display:grid;place-items:center;text-align:center;font-weight:900;z-index:5}#err{position:absolute;inset:20% 10%;background:#162f40;padding:20px;border-radius:18px;display:none;z-index:6}
</style></head><body><div id="loading">BUILDING YOUR CITY…<div style="font-size:12px;font-weight:400;margin-top:12px">Loading the real-time 3D engine</div></div><div id="err"></div><div id="hud"><div id="top"><div class="pill"><div class="small">EMPIRE TYCOON · CITY FIRST</div><div class="money" id="cash">$0</div><div class="income" id="rate">+$0/sec</div></div><div class="pill right"><div class="small">LAND OWNED</div><div style="font-weight:900;font-size:19px" id="owned">0 / 0</div><div style="font-size:11px;color:#c2e3e8">3D CITY ALPHA</div></div></div><div class="hint">Drag to move · Pinch to zoom · Tap a plot</div><div id="toast"></div><div id="sheet"></div><div id="bottom"><div class="pill info">🟩 Green lots: for sale<br>🟨 Gold lots: yours<br>🏢 Tap buildings to upgrade</div><div class="buttons"><button class="btn" id="zin">+</button><button class="btn" id="zout">−</button><button class="btn" id="home">⌂</button></div></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const $=id=>document.getElementById(id);const fmt=n=>'$'+Math.floor(n).toLocaleString('en-US');const key='empire_v11_land_alpha';let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}if(!state||!Array.isArray(state.plots))state={cash:65000,plots:[],last:Date.now()};
const scene=new THREE.Scene();scene.background=new THREE.Color('#9cd8ed');scene.fog=new THREE.Fog('#9cd8ed',105,240);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,450);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x638c67,2.4));const sun=new THREE.DirectionalLight(0xfff1d2,3);sun.position.set(-32,65,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-85;sun.shadow.camera.right=85;sun.shadow.camera.top=85;sun.shadow.camera.bottom=-85;sun.shadow.normalBias=.035;scene.add(sun);
const mat=(c,rough=1,metal=0)=>new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal});const grass=mat('#83bf74'),asphalt=mat('#465d65'),sidewalk=mat('#d8d6be'),line=mat('#e8dd9b'),wood=mat('#a97a4e'),roof=mat('#415970'),windowmat=mat('#73c8df',.26,.28),gold=mat('#ffc858'),green=mat('#55d58e'),water=mat('#4aa9c4',.25),trunk=mat('#806445'),leaf=mat('#3e9b64');
function cube(parent,w,h,d,x,y,z,m,cast=true){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;parent.add(o);return o}function cylinder(parent,rt,rb,h,x,y,z,m,n=8){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}const world=new THREE.Group();scene.add(world);cube(world,150,1,150,0,-.65,0,grass,false);cube(world,155,.1,17,0,-.09,72,water,false);
const roads=[-48,-16,16,48];for(const r of roads){cube(world,150,.08,8,0,.01,r,asphalt,false);cube(world,8,.08,150,r,.02,0,asphalt,false);for(let p=-72;p<=72;p+=10){cube(world,3,.012,.16,p,.065,r,line,false);cube(world,.16,.012,3,r,.065,p,line,false)}}
function tree(x,z,s=1){const g=new THREE.Group();g.position.set(x,0,z);world.add(g);cylinder(g,.24*s,.34*s,2.4*s,0,1.2*s,0,trunk);cylinder(g,1.25*s,1.5*s,2.6*s,0,3.1*s,0,leaf,7);cylinder(g,1*s,1.25*s,2.3*s,0,4.6*s,0,leaf,7)}
function building(parent,type,level){const g=new THREE.Group();parent.add(g);const h=type==='tower'?10+level*6:type==='apartment'?7+level*3:type==='shop'?3.8+level*1.1:5+level*1.7;const w=type==='tower'?6:type==='shop'?8:7;const wall=mat(type==='tower'?'#a8c9d6':type==='apartment'?'#edc7a0':type==='shop'?'#f5c88a':'#e3ddd0');cube(g,w,h,7,0,h/2,0,wall);cube(g,w+.8,.5,7.8,0,h+.2,0,type==='shop'?mat('#c95f50'):roof);cube(g,w+.5,.3,7.4,0,.2,0,mat('#eee9d8'));for(let y=1.7;y<h-1;y+=2.1)for(let x=-w/2+1.2;x<w/2;x+=2.2){cube(g,1.15,1.2,.08,x,y,3.55,windowmat,false);cube(g,1.15,1.2,.08,x,y,-3.55,windowmat,false)}cube(g,1.7,2.4,.14,0,1.2,3.62,mat('#5c7780'));if(type==='shop'){cube(g,w+1.2,.45,2.3,0,2.8,4.2,mat('#de725d'));cube(g,4,.75,.1,0,3.9,3.67,mat('#ffe9b0'))}if(type==='tower'){for(let i=0;i<4;i++)cube(g,.25,h,.25,(i%2?1:-1)*(w/2+.1),h/2,(i<2?1:-1)*3.3,mat('#f4f5ed'))}return g}
const plots=[];const positions=[-64,-32,0,32,64];let id=0;for(let ix=0;ix<5;ix++)for(let iz=0;iz<5;iz++){const x=positions[ix],z=positions[iz];if(ix===2&&iz===2)continue;const group=new THREE.Group();group.position.set(x,0,z);world.add(group);const price=6000+Math.round((Math.abs(ix-2)+Math.abs(iz-2))*2200);const p={id:id++,x,z,price,group,structure:null,base:null,outline:null};p.base=cube(group,18,.18,18,0,.12,0,mat('#a5d48b'));const edges=new THREE.EdgesGeometry(new THREE.BoxGeometry(18,.22,18));p.outline=new THREE.LineSegments(edges,new THREE.LineBasicMaterial({color:0x54e9a0}));p.outline.position.y=.13;group.add(p.outline);const own=state.plots.find(a=>a.id===p.id);p.data=own||{id:p.id,owned:false,type:null,level:0};plots.push(p);if(!own&&((ix===0&&iz===0)||(ix===4&&iz===3)||(ix===1&&iz===4))){p.data.owned=true;p.data.type=['shop','apartment','tower'][(ix+iz)%3];p.data.level=1;state.plots.push(p.data)}refreshPlot(p);}
function refreshPlot(p){if(p.structure){p.group.remove(p.structure);p.structure=null}p.base.material=mat(p.data.owned?'#c6b579':'#9bd98d');p.outline.material.color.set(p.data.owned?0xffd269:0x55e99d);if(p.data.type){p.structure=building(p.group,p.data.type,p.data.level)}else if(p.data.owned){cube(p.group,3,.22,3,0,.25,0,gold)}}
for(let i=0;i<110;i++){const x=(Math.random()-.5)*144,z=(Math.random()-.5)*144;if(roads.some(r=>Math.abs(x-r)<5||Math.abs(z-r)<5))continue;if(plots.some(p=>Math.abs(x-p.x)<11&&Math.abs(z-p.z)<11))continue;tree(x,z,.55+Math.random()*.6)}
for(let i=0;i<26;i++){const x=(Math.random()-.5)*140,z=(Math.random()-.5)*140;if(roads.some(r=>Math.abs(x-r)<5||Math.abs(z-r)<5))continue;if(plots.some(p=>Math.abs(x-p.x)<12&&Math.abs(z-p.z)<12))continue;cube(world,2,.1,2,x,.1,z,mat('#a9ca91'),false)}
const traffic=[];for(let i=0;i<15;i++){const road=roads[i%4];const horizontal=i%2===0;const car=new THREE.Group();world.add(car);const paint=mat(['#d45c4c','#f5cd61','#e8eee9','#528cb8','#405b71'][i%5]);cube(car,2,.75,3.5,0,.75,0,paint);cube(car,1.7,.65,1.9,0,1.42,-.2,windowmat);for(const x of [-1.04,1.04])for(const z of [-1.1,1.1])cylinder(car,.36,.36,.22,x,.36,z,mat('#26353b'),10).rotation.z=Math.PI/2;traffic.push({car,road,horizontal,speed:3+i*.3,t:i*9})}
let target=new THREE.Vector3(0,0,0),yaw=Math.PI/4,dist=87,elevation=.82;function updateCamera(){camera.position.set(target.x+Math.sin(yaw)*dist*Math.cos(elevation),dist*Math.sin(elevation),target.z+Math.cos(yaw)*dist*Math.cos(elevation));camera.lookAt(target.x,0,target.z)}updateCamera();const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let pointers=new Map(),start=null,pinch=0,selected=null;
function pointerPos(e){return {x:e.clientX,y:e.clientY}}renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);pointers.set(e.pointerId,pointerPos(e));if(pointers.size===1)start={x:e.clientX,y:e.clientY,moved:false};if(pointers.size===2){const a=[...pointers.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});renderer.domElement.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,pointerPos(e));if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch)dist=THREE.MathUtils.clamp(dist*pinch/d,24,130);pinch=d;if(start)start.moved=true;return}const dx=e.clientX-prev.x,dy=e.clientY-prev.y;if(start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>7)start.moved=true;const scale=dist*.0025;target.x=THREE.MathUtils.clamp(target.x+(-dx*Math.cos(yaw)+dy*Math.sin(yaw))*scale,-65,65);target.z=THREE.MathUtils.clamp(target.z+(dx*Math.sin(yaw)+dy*Math.cos(yaw))*scale,-65,65)});function end(e){if(start&&!start.moved&&pointers.size===1){mouse.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(plots.map(p=>p.group),true);if(hits.length){let o=hits[0].object;while(o.parent&&!plots.some(p=>p.group===o))o=o.parent;const p=plots.find(p=>p.group===o);if(p)showPlot(p)}}pointers.delete(e.pointerId);if(!pointers.size)start=null}renderer.domElement.addEventListener('pointerup',end);renderer.domElement.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);start=null});renderer.domElement.addEventListener('wheel',e=>{dist=THREE.MathUtils.clamp(dist+e.deltaY*.05,24,130)},{passive:true});
const costs={shop:12000,apartment:24000,tower:48000},rates={shop:18,apartment:42,tower:95};function income(){return plots.reduce((sum,p)=>sum+(p.data.type?rates[p.data.type]*p.data.level:0),0)}function save(){state.last=Date.now();localStorage.setItem(key,JSON.stringify(state))}function hud(){$('cash').textContent=fmt(state.cash);$('rate').textContent='+'+fmt(income())+'/sec';$('owned').textContent=plots.filter(p=>p.data.owned).length+' / '+plots.length}function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',2400)}function spend(amount){if(state.cash<amount){toast('Not enough cash. Your properties earn automatically.');return false}state.cash-=amount;return true}
function showPlot(p){selected=p;const d=p.data,s=$('sheet');let html=`<button class="x" id="close">×</button><h2>📍 Plot ${p.id+1}</h2>`;if(!d.owned){html+=`<p>Empty ${18*18} m² development lot. Purchase it to unlock construction.</p><div class="row"><button class="buy" data-buy="land">Buy land · ${fmt(p.price)}</button></div>`}else if(!d.type){html+=`<p>You own this land. Choose what to construct; your building will appear directly on the plot.</p><div class="row">${Object.keys(costs).map(k=>`<button class="buy" data-build="${k}">${k==='shop'?'🏪 Shop':k==='apartment'?'🏘️ Apartments':'🏙️ Office tower'}<br>${fmt(costs[k])}</button>`).join('')}</div>`}else{const c=Math.round(costs[d.type]*(1+d.level*.85));html+=`<p>${d.type.toUpperCase()} · Level ${d.level}<br>Income: <b style="color:#76ecaa">${fmt(rates[d.type]*d.level)}/sec</b><br>Upgrade the structure to visibly expand it and earn more.</p><div class="row"><button class="buy" data-upgrade="1">Upgrade · ${fmt(c)}</button><button class="buy secondary" data-demolish="1">Demolish</button></div>`}s.innerHTML=html;s.style.display='block';$('close').onclick=()=>s.style.display='none';s.querySelectorAll('[data-buy],[data-build],[data-upgrade],[data-demolish]').forEach(b=>b.onclick=()=>{if(b.dataset.buy){if(spend(p.price)){d.owned=true;state.plots.push(d)}}else if(b.dataset.build){const k=b.dataset.build;if(spend(costs[k])){d.type=k;d.level=1}}else if(b.dataset.upgrade){if(spend(Math.round(costs[d.type]*(1+d.level*.85))))d.level++}else if(b.dataset.demolish){d.type=null;d.level=0}refreshPlot(p);hud();save();showPlot(p)})}
$('zin').onclick=()=>dist=Math.max(24,dist*.78);$('zout').onclick=()=>dist=Math.min(130,dist*1.28);$('home').onclick=()=>{target.set(0,0,0);yaw=Math.PI/4;dist=87;$('sheet').style.display='none'};
const offline=Math.min(Math.max(0,(Date.now()-(state.last||Date.now()))/1000),8*3600);if(offline>5){const earned=offline*income()*.3;state.cash+=earned;setTimeout(()=>toast('Welcome back! Offline earnings: '+fmt(earned)),1200)}hud();save();let last=performance.now(),acc=0;function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.1);last=now;acc+=dt;for(const t of traffic){t.t+=dt*t.speed;const v=(t.t%152)-76;t.car.position.set(t.horizontal?v:t.road+(t.t%2?1.6:-1.6),0,t.horizontal?t.road+1.6:v);t.car.rotation.y=t.horizontal?Math.PI/2:0}if(acc>=.25){state.cash+=income()*acc;acc=0;hud()}updateCamera();renderer.render(scene,camera)}requestAnimationFrame(frame);setInterval(save,4000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});$('loading').remove();
</script><script>window.addEventListener('error',e=>{const el=document.getElementById('err');if(el){el.style.display='block';el.textContent='3D engine error: '+e.message+' — Please open in Safari with an internet connection.'}})</script></body></html>

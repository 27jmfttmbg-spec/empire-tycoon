<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e16"><meta name="apple-mobile-web-app-capable" content="yes"><title>EMPIRE // Tycoon</title><style>
:root{--bg:#080e16;--panel:#111b29;--panel2:#172335;--stroke:#263448;--txt:#f0f6ff;--muted:#8fa0b5;--gold:#e9bf70;--green:#43d6aa;--red:#ff7387;--blue:#75aaff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1a2d40 0,#080e16 56%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}button,input,select{font:inherit}button{cursor:pointer}#app{max-width:760px;margin:auto;min-height:100dvh;padding:0 15px 100px}.top{display:flex;justify-content:space-between;align-items:center;padding:23px 2px 18px}.brand{font-size:18px;font-weight:900;letter-spacing:3px}.brand span{color:var(--gold)}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}.round{background:#1b2939;border:1px solid var(--stroke);border-radius:50%;height:38px;width:38px;color:var(--gold)}.hero{background:linear-gradient(130deg,#263c50,#142131 55%,#101b2a);border:1px solid #3a4857;border-radius:22px;padding:21px;box-shadow:0 15px 40px #0005;position:relative;overflow:hidden}.hero:after{content:'◆';position:absolute;right:-15px;top:-35px;font-size:175px;color:#ffffff06;transform:rotate(12deg)}.money{font-size:37px;font-weight:850;letter-spacing:-1.7px;margin:8px 0}.money small{font-size:18px;color:var(--gold)}.hero-foot{display:flex;justify-content:space-between;gap:10px;margin-top:17px;position:relative}.hero-foot div{flex:1;border-top:1px solid #ffffff22;padding-top:12px}.hero-foot strong{display:block;font-size:15px;margin-top:5px}.pos{color:var(--green)!important}.neg{color:var(--red)!important}.gold{color:var(--gold)!important}.section{display:flex;justify-content:space-between;align-items:center;margin:23px 2px 11px}.section h2{font-size:17px;letter-spacing:-.4px;margin:0}.section small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--panel);border:1px solid var(--stroke);border-radius:17px;padding:15px;min-width:0}.card .value{font-size:21px;font-weight:800;margin:7px 0 3px;letter-spacing:-.5px}.card small,.sub{font-size:12px;color:var(--muted);line-height:1.5}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.business{background:var(--panel);border:1px solid var(--stroke);border-radius:18px;padding:15px;margin-bottom:10px}.biz-head{display:flex;align-items:center;gap:12px}.emoji{width:47px;height:47px;border-radius:14px;background:linear-gradient(135deg,#273c4e,#1a2837);display:grid;place-items:center;font-size:24px;flex-shrink:0}.biz-name{font-size:15px;font-weight:800}.biz-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;border-top:1px solid var(--stroke);padding-top:13px;margin-top:13px}.biz-stats strong{font-size:13px;display:block;margin-top:4px}.meter{height:5px;background:#293849;border-radius:10px;overflow:hidden;margin-top:12px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f7e3b2);border-radius:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.btn{border:1px solid #3c5062;background:#213248;color:#eaf2fc;border-radius:10px;padding:10px 12px;font-weight:750;font-size:12px;min-height:39px}.btn.primary{background:linear-gradient(125deg,#eacb8b,#c89b52);color:#151c25;border-color:#e8c27c}.btn.danger{color:var(--red)}.btn:disabled{opacity:.4}.btn.wide{width:100%;padding:13px}.tabbar{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#0e1824f5;border-top:1px solid var(--stroke);padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;backdrop-filter:blur(18px)}.tab{border:0;background:transparent;color:#8496ab;display:grid;place-items:center;gap:4px;font-size:10px;font-weight:650;min-width:52px;padding:6px 2px}.tab b{font-size:21px;font-weight:400}.tab.active{color:var(--gold)}.advance{position:sticky;bottom:82px;z-index:5;margin-top:22px;box-shadow:0 8px 25px #0009}.pill{font-size:10px;padding:5px 8px;border-radius:20px;background:#273749;color:var(--muted);font-weight:800;white-space:nowrap}.divider{border-top:1px solid var(--stroke);margin:15px 0}.listitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--stroke)}.listitem:last-child{border:0}.listitem strong{font-size:14px}.listitem small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.feed{font-size:12px;color:var(--muted);border-left:2px solid var(--gold);padding:6px 0 6px 12px;margin:8px 0}.feed strong{color:var(--txt)}.chart{height:95px;display:flex;align-items:end;gap:5px;margin-top:12px;border-bottom:1px solid #455064}.bar{flex:1;min-width:0;background:linear-gradient(0deg,#537b83,#d7b878);border-radius:4px 4px 0 0;opacity:.9}.modal-wrap{position:fixed;inset:0;z-index:50;background:#02070cbb;display:flex;align-items:end;justify-content:center;padding:10px}.modal{width:100%;max-width:600px;background:#152234;border:1px solid #435166;border-radius:22px;padding:21px;max-height:88dvh;overflow:auto}.modal h2{margin:0 0 10px}.modal p{color:var(--muted);font-size:13px;line-height:1.6}.input{width:100%;background:#0d1724;color:var(--txt);border:1px solid #3d4c61;border-radius:11px;padding:13px;margin:8px 0}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#23394b;color:white;padding:12px 18px;border:1px solid var(--gold);border-radius:12px;z-index:100;max-width:90vw;font-size:13px;box-shadow:0 10px 30px #0009}.empty{text-align:center;padding:28px 16px;color:var(--muted);font-size:13px}.market{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.market .card{min-width:150px;flex:1}.hint{font-size:12px;color:var(--muted);line-height:1.6}.badge{background:#243a3a;color:var(--green);font-size:10px;border-radius:6px;padding:4px 7px}.lock{opacity:.75}.switch{display:flex;gap:7px;margin:12px 0}.switch button{flex:1}.switch .selected{background:#b9985f;color:#111}.foot{font-size:11px;text-align:center;color:#52677d;padding:18px}.titleline{font-size:26px;font-weight:850;letter-spacing:-1px;margin:0 0 6px}@media(min-width:650px){.money{font-size:48px}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div id="app"></div><nav id="nav" class="tabbar"></nav><div id="overlay"></div><div id="toast"></div><script>
(()=>{'use strict';
const CATALOG=[{id:'lawn',name:'Lawn Care',icon:'🌿',cost:2500,base:2100,expense:700,cap:90,staff:3},{id:'wash',name:'Car Wash',icon:'🚙',cost:14500,base:6500,expense:2800,cap:85,staff:6},{id:'coffee',name:'Coffee Shop',icon:'☕',cost:48000,base:15500,expense:7800,cap:80,staff:9},{id:'gym',name:'Fitness Club',icon:'🏋️',cost:125000,base:37000,expense:20500,cap:75,staff:15},{id:'restaurant',name:'Restaurant',icon:'🍽️',cost:325000,base:95000,expense:57000,cap:75,staff:22},{id:'software',name:'Software Studio',icon:'💻',cost:850000,base:225000,expense:120000,cap:65,staff:35},{id:'factory',name:'Manufacturing',icon:'🏭',cost:2400000,base:600000,expense:380000,cap:65,staff:65},{id:'hotel',name:'Luxury Hotel',icon:'🏨',cost:7500000,base:1850000,expense:1190000,cap:60,staff:100},{id:'bank',name:'Investment Bank',icon:'🏦',cost:25000000,base:5900000,expense:3700000,cap:55,staff:140}];
const PROPS=[{id:'condo',name:'City Apartment',icon:'🏢',price:95000,rent:850},{id:'duplex',name:'Duplex',icon:'🏘️',price:380000,rent:3300},{id:'office',name:'Office Tower',icon:'🏙️',price:2700000,rent:25000},{id:'resort',name:'Beach Resort',icon:'🏝️',price:16000000,rent:150000}];
const STOCKS=[{id:'tech',name:'NOVA Technologies',ticker:'NOVA',price:120,vol:.14},{id:'retail',name:'MERIDIAN Retail',ticker:'MRDN',price:56,vol:.08},{id:'energy',name:'VOLT Energy',ticker:'VOLT',price:82,vol:.12},{id:'fund',name:'Atlas Index Fund',ticker:'ATLS',price:250,vol:.05}];
const RIVALS=[{id:'alpha',name:'Apex Group',industry:'Retail & Services',value:280000,share:16},{id:'nova',name:'Northstar Capital',industry:'Technology',value:1800000,share:22},{id:'titan',name:'Titan Industries',industry:'Manufacturing',value:11000000,share:28}];
const KEY='empire_deep_v1';let state,tab='overview',modal=null,toastTimer=null;
const fresh=()=>({month:1,cash:15000,debt:0,credit:690,rate:.095,market:1,inflation:.025,cycle:'Expansion',reputation:50,businesses:[],properties:[],stocks:{},prices:Object.fromEntries(STOCKS.map(x=>[x.id,x.price])),rivals:RIVALS.map(x=>({...x,owned:false})),history:[15000],reports:[],events:[{month:1,text:'Your holding company is founded. Your first $15,000 is ready to invest.'}],lastReport:null});
try{state=JSON.parse(localStorage.getItem(KEY))||fresh();if(!state.businesses||!state.prices)throw 0}catch(e){state=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const $=n=>{if(!isFinite(n))return '$0';const a=Math.abs(n),s=n<0?'−':'';return s+'$'+(a>=1e9?(a/1e9).toFixed(2)+'B':a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e4?(a/1e3).toFixed(1)+'K':a.toLocaleString('en-US',{maximumFractionDigits:0}))};
const pct=n=>(n*100).toFixed(1)+'%';const fmt=n=>Math.round(n).toLocaleString();const byId=id=>CATALOG.find(x=>x.id===id);const assetValue=()=>state.businesses.reduce((a,b)=>a+byId(b.id).cost*b.level*(1+b.brand*.012),0)+state.properties.reduce((a,p)=>a+p.value,0)+Object.keys(state.stocks).reduce((a,id)=>a+(state.stocks[id]||0)*state.prices[id],0)+state.rivals.filter(x=>x.owned).reduce((a,r)=>a+r.value,0);const worth=()=>state.cash+assetValue()-state.debt;
const businessCalc=(b)=>{const c=byId(b.id);const workers=b.workers;const capacity=Math.min(1,workers/(c.staff*b.level));const demand=Math.max(.25,Math.min(1.3,state.market*(1-(b.price-1)*.75)*(1+b.brand*.015)));const rev=c.base*b.level*capacity*demand*b.price*(1+b.marketing*.045);const wages=workers*(c.expense/c.staff)*.48*(1+state.inflation);const fixed=c.expense*b.level*.52*(1+state.inflation);const marketing=b.marketing*c.base*.035*b.level;const cost=wages+fixed+marketing;return{rev,cost,profit:rev-cost,capacity,demand};};
const forecast=()=>{let rev=0,exp=0;state.businesses.forEach(b=>{const x=businessCalc(b);rev+=x.rev;exp+=x.cost});const rent=state.properties.reduce((a,p)=>a+p.rent*(p.occupancy?1:0),0);const rival=state.rivals.filter(x=>x.owned).reduce((a,r)=>a+r.value*.012*state.market,0);const interest=state.debt*state.rate/12;return{rev:rev+rent+rival,exp:exp+interest,profit:rev+rent+rival-exp-interest,interest,rent,rival}};
function notify(msg){const el=document.getElementById('toast');el.innerHTML='<div class="toast">'+msg+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.innerHTML='',2900)}
function action(fn){try{fn();save();render()}catch(e){console.error(e);notify('Something went wrong. Try again.')}}
function log(msg){state.events.unshift({month:state.month,text:msg});state.events=state.events.slice(0,35)}
function buyBiz(id){action(()=>{const c=byId(id);if(state.cash<c.cost)return notify('Not enough cash to acquire this business');state.cash-=c.cost;const found=state.businesses.find(x=>x.id===id);if(found){found.level++;found.workers+=c.staff;log('Expanded '+c.name+' to '+found.level+' locations.')}else{state.businesses.push({id,level:1,workers:c.staff,price:1,marketing:0,brand:0});log('Acquired '+c.name+' for '+$(c.cost)+'.')}state.reputation=Math.min(100,state.reputation+2);notify(c.name+' acquired!')})}
function updateBiz(id,field,delta){action(()=>{const b=state.businesses.find(x=>x.id===id);const c=byId(id);if(!b)return;if(field==='workers'){const next=b.workers+delta;if(next<0||next>c.staff*b.level*2)return;const hiring=delta>0?delta*850:0;if(state.cash<hiring)return notify('Not enough cash for hiring costs');state.cash-=hiring;b.workers=next}else if(field==='price')b.price=Math.max(.6,Math.min(1.8,Math.round((b.price+delta)*100)/100));else if(field==='marketing')b.marketing=Math.max(0,Math.min(5,b.marketing+delta));else if(field==='brand'){const cost=c.cost*.15*(b.brand+1);if(state.cash<cost)return notify('Not enough cash for brand investment');state.cash-=cost;b.brand++}log(c.name+' management updated.')})}
function takeLoan(amount){action(()=>{const max=Math.max(0,Math.round((Math.max(25000,assetValue()*.55)-state.debt)/1000)*1000);if(amount>max||amount<=0)return notify('Loan exceeds your credit limit');state.cash+=amount;state.debt+=amount;state.credit=Math.max(300,state.credit-8);log('Borrowed '+$(amount)+' at '+pct(state.rate)+' APR.');modal=null;notify('Loan funded')})}
function repay(amount){action(()=>{amount=Math.min(amount,state.debt,state.cash);if(amount<=0)return notify('No available funds to repay');state.cash-=amount;state.debt-=amount;state.credit=Math.min(850,state.credit+5);log('Repaid '+$(amount)+' in principal.');modal=null})}
function buyProp(id){action(()=>{const p=PROPS.find(x=>x.id===id);if(state.cash<p.price)return notify('Not enough cash for this property');state.cash-=p.price;state.properties.push({...p,value:p.price,occupancy:true});log('Purchased '+p.name+' for '+$(p.price)+'.');notify('Property acquired')})}
function trade(id,qty){action(()=>{qty=Math.trunc(qty);if(!qty)return;const cost=qty*state.prices[id];if(qty>0&&cost>state.cash)return notify('Insufficient cash');if(qty<0&&-qty>(state.stocks[id]||0))return notify('Insufficient shares');state.cash-=cost;state.stocks[id]=(state.stocks[id]||0)+qty;log((qty>0?'Bought ':'Sold ')+Math.abs(qty)+' shares of '+id.toUpperCase()+'.');modal=null})}
function acquireRival(id){action(()=>{const r=state.rivals.find(x=>x.id===id);if(r.owned)return;const price=Math.round(r.value*1.2);if(state.cash<price)return notify('Insufficient cash for acquisition');state.cash-=price;r.owned=true;state.reputation=Math.min(100,state.reputation+10);log('Completed hostile takeover of '+r.name+' for '+$(price)+'.');notify('Merger complete!')})}
function advance(){action(()=>{const f=forecast();let event='';const dice=Math.random();if(dice<.12){state.market=Math.max(.55,state.market-.08);event='Consumer confidence drops. Demand weakens.'}else if(dice<.24){state.market=Math.min(1.3,state.market+.07);event='Consumer spending surges. Businesses see stronger demand.'}else{state.market=Math.max(.65,Math.min(1.25,state.market+(Math.random()-.5)*.055))}state.cycle=state.market<.78?'Recession':state.market>1.12?'Boom':'Expansion';state.inflation=Math.max(.005,Math.min(.085,state.inflation+(Math.random()-.5)*.007));state.rate=Math.max(.045,Math.min(.19,state.rate+(Math.random()-.5)*.007));state.month++;let revenue=0,expenses=0;state.businesses.forEach(b=>{const v=businessCalc(b);const swing=.91+Math.random()*.18;revenue+=v.rev*swing;expenses+=v.cost});const rent=state.properties.reduce((a,p)=>{p.value*=1+(Math.random()-.42)*.02;p.occupancy=Math.random()>.055;return a+(p.occupancy?p.rent:0)},0);const rivalIncome=state.rivals.filter(r=>r.owned).reduce((a,r)=>a+r.value*.012*state.market,0);state.rivals.forEach(r=>{r.value*=1+(Math.random()-.45)*.045;if(!r.owned)r.share=Math.max(5,Math.min(45,r.share+(Math.random()-.5)*3))});STOCKS.forEach(s=>{state.prices[s.id]=Math.max(1,state.prices[s.id]*(1+(Math.random()-.46)*s.vol+(state.market-1)*.018))});const interest=state.debt*state.rate/12;const principal=Math.min(state.debt,state.debt*.012);state.debt-=principal;const profit=revenue+rent+rivalIncome-expenses-interest-principal;state.cash+=profit;state.credit=Math.max(300,Math.min(850,state.credit+(profit>0?1:-3)));state.lastReport={month:state.month,revenue:revenue+rent+rivalIncome,expenses:expenses+interest+principal,profit,interest,principal,rent,rivalIncome};state.reports.unshift(state.lastReport);state.reports=state.reports.slice(0,24);state.history.push(Math.max(0,worth()));state.history=state.history.slice(-18);log('Month '+state.month+' closed: '+(profit>=0?'+':'')+$(profit)+' cash flow.');if(event)log(event);if(state.cash<0){log('WARNING: Negative cash balance. Sell assets or refinance to avoid insolvency.');notify('Warning: your cash balance is negative')}else notify('Month '+state.month+' complete · '+$(profit)+' cash flow');tab='overview'})}
function reset(){if(confirm('Start a completely new empire? This permanently erases your current save.')){state=fresh();tab='overview';modal=null;save();render()}}
const h=(title,right='')=>`<div class="section"><h2>${title}</h2><small>${right}</small></div>`;
const btn=(label,onclick,kind='')=>`<button class="btn ${kind}" onclick="${onclick}">${label}</button>`;
function chart(){const hist=state.history;const lo=Math.min(...hist),hi=Math.max(...hist);return `<div class="chart">${hist.map(n=>`<div class="bar" style="height:${Math.max(8,((n-lo)/(hi-lo||1))*85+10)}%"></div>`).join('')}</div><div class="row sub" style="margin-top:7px"><span>Month ${Math.max(1,state.month-hist.length+1)}</span><span>Month ${state.month}</span></div>`}
function overview(){const f=forecast();return `<div class="hero"><div class="eyebrow">Total net worth · Month ${state.month}</div><div class="money"><small>$</small>${$(worth()).slice(1)}</div><div class="row"><span class="pill">${state.cycle} economy</span><span class="pill">Credit ${state.credit}</span></div><div class="hero-foot"><div><span class="eyebrow">Cash on hand</span><strong>${$(state.cash)}</strong></div><div><span class="eyebrow">Monthly cash flow</span><strong class="${f.profit>=0?'pos':'neg'}">${$(f.profit)}</strong></div><div><span class="eyebrow">Total debt</span><strong>${$(state.debt)}</strong></div></div></div>${h('Financial overview','Projected / month')}<div class="grid"><div class="card"><div class="eyebrow">Revenue</div><div class="value pos">${$(f.rev)}</div><small>Business + investment income</small></div><div class="card"><div class="eyebrow">Expenses</div><div class="value">${$(f.exp)}</div><small>Operating costs + interest</small></div><div class="card"><div class="eyebrow">Assets</div><div class="value">${$(assetValue())}</div><small>Portfolio market value</small></div><div class="card"><div class="eyebrow">Profit margin</div><div class="value ${f.profit>=0?'pos':'neg'}">${f.rev?pct(f.profit/f.rev):'—'}</div><small>Projected operating margin</small></div></div>${h('Empire growth','Net worth history')}<div class="card">${chart()}</div>${h('Economic climate')}<div class="card"><div class="row"><div><strong>${state.cycle}</strong><div class="sub">Consumer demand index</div></div><strong class="${state.market>=1?'pos':'neg'}">${Math.round(state.market*100)} / 100</strong></div><div class="meter"><i style="width:${Math.min(100,state.market/1.3*100)}%"></i></div><div class="divider"></div><div class="row sub"><span>Inflation <b>${pct(state.inflation)}</b></span><span>Borrowing APR <b>${pct(state.rate)}</b></span></div></div>${h('Your empire',state.businesses.length+' industries')}<div class="card"><div class="row"><span>🏢 Operating locations</span><strong>${state.businesses.reduce((a,b)=>a+b.level,0)}</strong></div><div class="divider"></div><div class="row"><span>👥 Employees</span><strong>${state.businesses.reduce((a,b)=>a+b.workers,0)}</strong></div><div class="divider"></div><div class="row"><span>🏘️ Properties</span><strong>${state.properties.length}</strong></div><div class="divider"></div><div class="row"><span>🤝 Acquired competitors</span><strong>${state.rivals.filter(r=>r.owned).length}</strong></div></div>${h('Latest developments')}<div class="card">${state.events.slice(0,5).map(e=>`<div class="feed"><strong>M${e.month}</strong> · ${e.text}</div>`).join('')}</div><button class="btn primary wide advance" onclick="game.advance()">⏩ &nbsp; Advance one month</button>`}
function businessCard(b){const c=byId(b.id),v=businessCalc(b),target=c.staff*b.level;return `<div class="business"><div class="biz-head"><div class="emoji">${c.icon}</div><div style="flex:1;min-width:0"><div class="biz-name">${c.name}</div><div class="sub">${b.level} location${b.level>1?'s':''} · ${b.workers} employees</div></div><span class="pill">${pct(v.capacity)} staffed</span></div><div class="biz-stats"><div><span class="eyebrow">Revenue</span><strong>${$(v.rev)}</strong></div><div><span class="eyebrow">Expenses</span><strong>${$(v.cost)}</strong></div><div><span class="eyebrow">Profit</span><strong class="${v.profit>=0?'pos':'neg'}">${$(v.profit)}</strong></div></div><div class="meter"><i style="width:${v.capacity*100}%"></i></div><div class="sub" style="margin-top:10px">Pricing: ${pct(b.price)} of base · Marketing: ${b.marketing}/5 · Brand: ${b.brand}</div><div class="actions">${btn('Manage','game.manage(\''+b.id+'\')','primary')}${btn('Expand · '+$(c.cost),'game.buyBiz(\''+b.id+'\')')}</div></div>`}
function businesses(){return `<h1 class="titleline">Businesses</h1><div class="hint">Build companies with real operating costs. Hiring, pricing and advertising change profitability.</div>${h('Your companies',state.businesses.length+' owned')}${state.businesses.length?state.businesses.map(businessCard).join(''):'<div class="empty card">No businesses yet. Acquire your first company below.</div>'}${h('Acquire a business','Purchase price')}${CATALOG.filter(c=>!state.businesses.some(b=>b.id===c.id)).map(c=>`<div class="listitem"><div class="row"><div class="emoji">${c.icon}</div><div><strong>${c.name}</strong><small>Base revenue ${$(c.base)}/mo · ${c.staff} staff</small></div></div>${btn($(c.cost),'game.buyBiz(\''+c.id+'\')','primary')}</div>`).join('')}`}
function investments(){return `<h1 class="titleline">Investments</h1><div class="hint">Build wealth through property rental income and a fluctuating stock market. Values update every month.</div>${h('Stock market','Live simulation')}${STOCKS.map(s=>{const owned=state.stocks[s.id]||0;return `<div class="business"><div class="row"><div><strong>${s.ticker}</strong><div class="sub">${s.name}</div></div><div style="text-align:right"><strong>${$(state.prices[s.id])}</strong><div class="sub">${owned} shares · ${$(owned*state.prices[s.id])}</div></div></div><div class="actions">${btn('Buy shares','game.tradeModal(\''+s.id+'\',1)','primary')}${btn('Sell shares','game.tradeModal(\''+s.id+'\',-1)')}</div></div>`}).join('')}${h('Real estate',state.properties.length+' owned')}${state.properties.map(p=>`<div class="listitem"><div><strong>${p.icon} ${p.name}</strong><small>Value ${$(p.value)} · ${p.occupancy?'Occupied':'Vacant'}</small></div><span class="pos">${$(p.occupancy?p.rent:0)}/mo</span></div>`).join('')}${h('Property marketplace')}${PROPS.map(p=>`<div class="listitem"><div><strong>${p.icon} ${p.name}</strong><small>Rental income ${$(p.rent)}/mo</small></div>${btn($(p.price),'game.buyProp(\''+p.id+'\')','primary')}</div>`).join('')}`}
function competition(){return `<h1 class="titleline">Competition</h1><div class="hint">Rival corporations grow independently. Acquire them at a premium to unlock passive earnings and expand your influence.</div>${h('Corporate rivals')}${state.rivals.map(r=>`<div class="business"><div class="row"><div><div class="biz-name">${r.name}</div><div class="sub">${r.industry}</div></div><span class="pill">${r.owned?'ACQUIRED':Math.round(r.share)+'% market share'}</span></div><div class="biz-stats"><div><span class="eyebrow">Valuation</span><strong>${$(r.value)}</strong></div><div><span class="eyebrow">Buyout cost</span><strong>${$(r.value*1.2)}</strong></div><div><span class="eyebrow">Potential income</span><strong class="pos">${$(r.value*.012*state.market)}/mo</strong></div></div>${r.owned?'<div class="sub" style="margin-top:12px">✓ Wholly owned subsidiary</div>':`<div class="actions">${btn('Acquire corporation','game.acquireRival(\''+r.id+'\')','primary')}</div>`}</div>`).join('')}${h('M&A strategy')}<div class="card hint">Buying a competitor costs 120% of its estimated valuation. Once acquired, it contributes monthly cash flow. Rival valuations change with economic conditions, so timing matters.</div>`}
function finance(){const f=forecast(),limit=Math.max(0,Math.round((Math.max(25000,assetValue()*.55)-state.debt)/1000)*1000);return `<h1 class="titleline">Finance</h1><div class="hint">Manage leverage, borrowing costs and the monthly profit and loss statement.</div>${h('Banking')}<div class="grid"><div class="card"><div class="eyebrow">Cash balance</div><div class="value">${$(state.cash)}</div></div><div class="card"><div class="eyebrow">Debt outstanding</div><div class="value">${$(state.debt)}</div></div><div class="card"><div class="eyebrow">Borrowing APR</div><div class="value">${pct(state.rate)}</div></div><div class="card"><div class="eyebrow">Credit score</div><div class="value">${state.credit}</div></div></div><div class="card" style="margin-top:10px"><div class="row"><div><strong>Available credit</strong><div class="sub">Collateral-based borrowing limit</div></div><strong>${$(limit)}</strong></div><div class="actions">${btn('Apply for loan','game.loanModal()','primary')}${btn('Repay debt','game.repayModal()')}</div></div>${h('Monthly P&L','Projected')}<div class="card"><div class="listitem"><span>Business and asset revenue</span><strong class="pos">${$(f.rev)}</strong></div><div class="listitem"><span>Operating expenses</span><strong class="neg">−${$(f.exp-f.interest)}</strong></div><div class="listitem"><span>Debt interest</span><strong class="neg">−${$(f.interest)}</strong></div><div class="listitem"><strong>Net operating cash flow</strong><strong class="${f.profit>=0?'pos':'neg'}">${$(f.profit)}</strong></div></div>${h('Financial reports','Last '+state.reports.length+' months')}${state.reports.length?state.reports.slice(0,8).map(r=>`<div class="listitem"><div><strong>Month ${r.month}</strong><small>Revenue ${$(r.revenue)} · Costs ${$(r.expenses)}</small></div><strong class="${r.profit>=0?'pos':'neg'}">${$(r.profit)}</strong></div>`).join(''):'<div class="empty card">Advance one month to generate your first financial report.</div>'}${h('Game settings')}<div class="card"><div class="sub">Your empire saves automatically on this device.</div><div class="actions">${btn('Restart game','game.reset()','danger')}</div></div>`}
function manage(id){const b=state.businesses.find(x=>x.id===id),c=byId(id);modal=`<h2>${c.icon} ${c.name}</h2><p>Make operational decisions. Changes immediately affect projected monthly profitability.</p><div class="listitem"><div><strong>Employees</strong><small>${b.workers} hired · ${c.staff*b.level} fully staffed · $850 hiring fee</small></div><div>${btn('−','game.updateBiz(\''+id+'\',\'workers\',-1)')}${btn('+','game.updateBiz(\''+id+'\',\'workers\',1)','primary')}</div></div><div class="listitem"><div><strong>Customer pricing</strong><small>${pct(b.price)} of standard · Higher prices can reduce demand</small></div><div>${btn('−','game.updateBiz(\''+id+'\',\'price\',-.05)')}${btn('+','game.updateBiz(\''+id+'\',\'price\',.05)','primary')}</div></div><div class="listitem"><div><strong>Advertising</strong><small>Level ${b.marketing}/5 · Boosts revenue but adds expenses</small></div><div>${btn('−','game.updateBiz(\''+id+'\',\'marketing\',-1)')}${btn('+','game.updateBiz(\''+id+'\',\'marketing\',1)','primary')}</div></div><div class="listitem"><div><strong>Brand development</strong><small>Level ${b.brand} · Permanent demand improvement</small></div>${btn('Invest '+$(c.cost*.15*(b.brand+1)),'game.updateBiz(\''+id+'\',\'brand\',1)','primary')}</div>`;render()}
function tradeModal(id,sign){const s=STOCKS.find(x=>x.id===id);modal=`<h2>${sign>0?'Buy':'Sell'} ${s.ticker}</h2><p>Current share price: ${$(state.prices[id])}. You own ${state.stocks[id]||0} shares.</p><input class="input" id="quantity" type="number" min="1" step="1" value="1" placeholder="Number of shares"><button class="btn primary wide" onclick="game.confirmTrade('${id}',${sign})">Confirm ${sign>0?'purchase':'sale'}</button>`;render()}
function loanModal(){const limit=Math.max(0,Math.round((Math.max(25000,assetValue()*.55)-state.debt)/1000)*1000);modal=`<h2>Business financing</h2><p>Borrow up to ${$(limit)} at a floating ${pct(state.rate)} annual rate. Interest accrues monthly and principal amortizes over time.</p><input class="input" id="quantity" type="number" min="1000" step="1000" value="${Math.min(10000,limit)}"><button class="btn primary wide" onclick="game.confirmLoan()">Accept financing</button>`;render()}
function repayModal(){modal=`<h2>Repay business debt</h2><p>Outstanding balance: ${$(state.debt)}. Paying down debt reduces future interest costs.</p><input class="input" id="quantity" type="number" min="1" value="${Math.round(Math.min(state.cash,state.debt))}"><button class="btn primary wide" onclick="game.confirmRepay()">Make payment</button>`;render()}
function render(){const views={overview,businesses,investments,competition,finance};document.getElementById('app').innerHTML=`<header class="top"><div><div class="brand">EMPIRE<span>.</span></div><div class="eyebrow">Build wealth. Command markets.</div></div><button class="round" onclick="game.showHelp()">?</button></header>${views[tab]()}<div class="foot">EMPIRE TYCOON · DEEP ECONOMY EDITION</div>`;document.getElementById('nav').innerHTML=[['overview','◈','Home'],['businesses','▦','Business'],['investments','◉','Invest'],['competition','♜','Rivals'],['finance','▤','Finance']].map(([id,ic,name])=>`<button class="tab ${tab===id?'active':''}" onclick="game.tab('${id}')"><b>${ic}</b>${name}</button>`).join('');document.getElementById('overlay').innerHTML=modal?`<div class="modal-wrap" onclick="game.close()"><div class="modal" onclick="event.stopPropagation()"><div class="row" style="margin-bottom:12px"><span class="eyebrow">Management console</span><button class="round" onclick="game.close()">✕</button></div>${modal}</div></div>`:''}
window.game={tab:t=>{tab=t;modal=null;render();window.scrollTo(0,0)},close:()=>{modal=null;render()},advance,buyBiz,updateBiz,manage,buyProp,tradeModal,acquireRival,loanModal,repayModal,reset,confirmTrade:(id,s)=>trade(id,s*Number(document.getElementById('quantity').value)),confirmLoan:()=>takeLoan(Number(document.getElementById('quantity').value)),confirmRepay:()=>repay(Number(document.getElementById('quantity').value)),showHelp:()=>{modal='<h2>Welcome to Empire Tycoon</h2><p>Inspired by the progression of business empire games, with deeper economic management. Start by acquiring a lawn care company or car wash. Adjust staffing, pricing and advertising to improve profitability. Advance one month to collect revenue and pay expenses. Invest in stocks, property and corporate takeovers. Use loans carefully: recessions can turn aggressive growth into a cash crisis.</p><p>Progress saves automatically in your browser. This is a standalone offline-capable simulation with fictional companies and simulated markets.</p>';render()}};
render();
})();
</script></body></html>

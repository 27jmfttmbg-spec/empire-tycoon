const bases=new Map(),objects=new Map(),assetCache=new Map(),rayObjects=[];for(const p of properties){const g=new THREE.Group();g.position.set(p.x,0,p.z);world.add(g);const w=p.asset==='hotel'?115:p.asset==='exchange'?128:p.asset==='steakhouse'?88:p.asset==='mansion'?95:70;const depth=p.asset==='hotel'?110:p.asset==='exchange'?110:p.asset==='steakhouse'?108:p.asset==='mansion'?94:66;box(g,w,.6,depth,mats.stone,0,-.1,0);const rim=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w,.65,depth)),new THREE.LineBasicMaterial({color:0xe4c483}));rim.position.y=-.08;g.add(rim);bases.set(p.id,{g,rim});}

async function loadAsset(name){return new Promise((resolve,reject)=>{let settled=false;const timeout=setTimeout(()=>{if(!settled){settled=true;reject(new Error('Asset timeout: '+name))}},7500);// Models already uploaded alongside index.html are the primary source.

const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let startX=0,startY=0;renderer.domElement.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY});renderer.domElement.addEventListener('pointerup',e=>{if(gestureMoved||Math.hypot(e.clientX-startX,e.clientY-startY)>12)return;pointer.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(rayObjects,true)[0];if(hit){let obj=hit.object;while(obj&&!obj.userData.propertyId)obj=obj.parent;const p=properties.find(p=>p.id===obj?.userData.propertyId);if(p)showProperty(p)}});

for(let i=0;i<8;i++){const z=-198+i*48;for(const side of [-1,1]){const g=car(side*309,z,side===1?Math.PI:0,['#f6efe1','#182a38','#cb443b','#e6b35a'][i%4]);traffic.push({g,phase:i*48,speed:7+i*.3})}}
// Autosave every tick, credit up to four hours of real offline income.
let last=Date.now();
function creditElapsed(now,announce=false){
 const dt=Math.min(Math.max(0,now-last),MAX_OFFLINE_MS);last=now;
 if(dt>0){const earned=perMin()*dt/60000;save.cash+=earned;save.lifetime+=earned;

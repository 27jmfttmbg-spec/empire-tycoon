(65+i)+'. '+o[0]+'</button>').join('')+'</div></div></div>';document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(+b.dataset.choice));return}if(modal==='result'){e.innerHTML='<div class="dialogWrap"><div class="dialog"><h2>💬 Decision made</h2><div class="speech">'+message+'</div><button class="cta" id="continue">'+(state.chapter>=chapters.length?'Enter your city!':'Next decision →')+'</button></div></div>';$('continue').onclick=nextStory;return}if(modal==='bankrupt'){e.innerHTML='<div class="dialogWrap"><div class="dialog"><h2>💥 Bankruptcy</h2><div class="speech">Jordan: Our business has run out of money. Your decisions have consequences. Want to try again?</div><button class="cta" id="restart">Restart empire</button></div></div>';$('restart').onclick=()=>{localStorage.removeItem(KEY);location.reload()};return}e.innerHTML='<div class="dialogWrap"><div class="dialog"><h2>🎮 How to play</h2><div class="speech">Buy businesses to earn money automatically every second. Tap buildings on the map to manage them. Upgrade to grow your income. Buy investments for more passive income. Avoid excessive debt and bad business decisions.</div><button class="cta" id="closeHelp">Got it!</button></div></div>';$('closeHelp').onclick=()=>{modal='';drawModal()}}$('help').onclick=()=>{modal='help';drawModal()};if(state.storyDone){const away=Math.min(8*3600,Math.max(0,(Date.now()-(state.last||Date.now()))/1000));if(away>5){const gain=rate()*away;state.cash+=gain;state.total+=Math.max(0,gain);setTimeout(()=>toast('💰 Welcome back! '+money(gain)+' earned while away'),700)}}else modal='story';draw();drawModal();let saveCount=0;setInterval(()=>{const now=Date.now(),dt=Math.min(2,(now-lastFrame)/1000);lastFrame=now;earn(dt);updateCash();if(++saveCount%5===0)save();if(state.storyDone&&Math.random()<.16){const f=document.createElement('div');f.className='floating';f.style.left=(25+Math.random()*50)+'%';f.style.top=(42+Math.random()*32)+'%';f.textContent='+'+money(rate());$('world').append(f);setTimeout(()=>f.remove(),1000)}},1000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{const away=Math.min(8*3600,Math.max(0,(Date.now()-state.last)/1000));if(state.storyDone&&away>3){state.cash+=rate()*away;toast('💰 Earned '+money(rate()*away)+' while away')}lastFrame=Date.now();save();updateCash()}});window.addEventListener('pagehide',save);

// V9 camera: image and pins share one transform, so touch targets never drift.
(function initOpenWorldCamera(){
 const viewport=document.getElementById('worldscroll'),stage=document.getElementById('cityStage'),badge=document.getElementById('camBadge');
 if(!viewport||!stage)return;
 const SW=1250,SH=835;let scale=1,tx=0,ty=0,started=false,moved=false,blockClickUntil=0;
 const pointers=new Map();let gesture=null;
 const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
 function limit(){const w=viewport.clientWidth,h=viewport.clientHeight,ww=SW*scale,hh=SH*scale;
  const gutter=60;
  tx=ww<=w?(w-ww)/2:clamp(tx,w-ww-gutter,gutter);
  ty=hh<=h?(h-hh)/2:clamp(ty,h-hh-gutter,gutter);
 }
 function paint(){limit();stage.style.transform='translate3d('+tx+'px,'+ty+'px,0) scale('+scale+')';badge.textContent=Math.round(scale*100)+'%';}
 function fit(){const w=viewport.clientWidth,h=viewport.clientHeight;const next=clamp(Math.max(w/SW,h/SH)*1.24,.54,2.25);
  if(!started){scale=next;tx=(w-SW*scale)/2;ty=(h-SH*scale)/2;started=true;}paint();}
 function zoomTo(next,cx,cy){const rect=viewport.getBoundingClientRect();const x=cx-rect.left,y=cy-rect.top;
  const old=scale;scale=clamp(next,.43,2.7);tx=x-(x-tx)*scale/old;ty=y-(y-ty)*scale/old;paint();}
 function getPair(){const p=[...pointers.values()];if(p.length<2)return null;return {x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2,d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)};}
 viewport.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});viewport.setPointerCapture(e.pointerId);moved=false;
  if(pointers.size===2){const p=getPair();gesture={...p,scale,tx,ty};}
 },{passive:true});
 viewport.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;
  const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size>=2){const pair=getPair();if(!pair)return;if(!gesture)gesture={...pair,scale,tx,ty};
   const next=clamp(gesture.scale*pair.d/Math.max(1,gesture.d),.43,2.7),rect=viewport.getBoundingClientRect();
   tx=gesture.tx+(pair.x-gesture.x)-(gesture.x-rect.left-gesture.tx)*(next/gesture.scale-1);
   ty=gesture.ty+(pair.y-gesture.y)-(gesture.y-rect.top-gesture.ty)*(next/gesture.scale-1);
   scale=next;moved=true;blockClickUntil=Date.now()+400;paint();
  }else{const dx=e.clientX-prev.x,dy=e.clientY-prev.y;tx+=dx;ty+=dy;if(Math.abs(dx)+Math.abs(dy)>1){moved=true;blockClickUntil=Date.now()+160;}paint();}
 },{passive:true});
 function end(e){pointers.delete(e.pointerId);if(pointers.size<2)gesture=null;if(!pointers.size){viewport.classList.remove('dragging');}}
 viewport.addEventListener('pointerup',end);viewport.addEventListener('pointercancel',end);
 viewport.addEventListener('pointermove',()=>{if(pointers.size)viewport.classList.add('dragging')},{passive:true});
 // Capture clicks only after an actual pan, leaving ordinary building taps functional.
 viewport.addEventListener('click',e=>{if(Date.now()<blockClickUntil){e.preventDefault();e.stopImmediatePropagation();}},{capture:true});
 document.getElementById('camPlus').addEventListener('click',()=>zoomTo(scale*1.28,viewport.getBoundingClientRect().left+viewport.clientWidth/2,viewport.getBoundingClientRect().top+viewport.clientHeight/2));
 document.getElementById('camMinus').addEventListener('click',()=>zoomTo(scale/1.28,viewport.getBoundingClientRect().left+viewport.clientWidth/2,viewport.getBoundingClientRect().top+viewport.clientHeight/2));
 document.getElementById('camHome').addEventListener('click',()=>{scale=clamp(Math.max(viewport.clientWidth/SW,viewport.clientHeight/SH)*1.24,.54,2.25);tx=(viewport.clientWidth-SW*scale)/2;ty=(viewport.clientHeight-SH*scale)/2;paint();});
 viewport.addEventListener('wheel',e=>{e.preventDefault();zoomTo(scale*(e.deltaY<0?1.1:.9),e.clientX,e.clientY)},{passive:false});
 window.addEventListener('resize',paint);requestAnimationFrame(fit);
})();
</script></body></html>

// Phase 02 geometry is independent of property state; old saves remain valid.
// PHASE 02 SPATIAL CONTRACT — fails loudly during development if any plot
// intersects a driving lane or another plot, or if a mirror partner is missing.
const layoutPlots=properties.map(p=>({id:p.id,x:p.x,z:p.z,
 w:p.asset==='hotel'?115:p.asset==='exchange'?128:p.asset==='steakhouse'?88:p.asset==='mansion'?95:70,
 d:p.asset==='hotel'?110:p.asset==='exchange'?110:p.asset==='steakhouse'?108:p.asset==='mansion'?94:66}));
const drivingLanes=[{name:'WEST COAST ROAD',x:-309,z:-2,w:13,d:434},
 {name:'EAST COAST ROAD',x:309,z:-2,w:13,d:434},
 {name:'NORTH ROAD',x:0,z:-213,w:636,d:12},
 {name:'SOUTH ROAD',x:0,z:211,w:636,d:12}];
function intersects(a,b){return Math.abs(a.x-b.x)*2<a.w+b.w-0.001&&Math.abs(a.z-b.z)*2<a.d+b.d-0.001}
function validateCityPlan(){
 const problems=[];
 for(let i=0;i<layoutPlots.length;i++){
  const p=layoutPlots[i];
  for(const r of drivingLanes)if(intersects(p,r))problems.push(p.id+' intersects '+r.name);
  for(let j=i+1;j<layoutPlots.length;j++)if(intersects(p,layoutPlots[j]))problems.push(p.id+' intersects '+layoutPlots[j].id);
  if(p.x!==0&&!layoutPlots.some(q=>q.x===-p.x&&q.z===p.z&&q.w===p.w&&q.d===p.d))
   problems.push(p.id+' has no exact mirrored parcel');
 }
 if(problems.length)throw Error('MASTERPLAN VALIDATION FAILED: '+problems.join('; '));
 console.info('EMPIRE masterplan: 9 plots, zero overlaps, 4 perimeter roads, mirrored parcels verified');
}
validateCityPlan();
// Architectural platforms match the mirrored urban planning grid.
const bases=new Map(),objects=new Map(),assetCache=new Map(),rayObjects=[];for(const p of properties){const g=new THREE.Group();g.position.set(p.x,0,p.z);world.add(g);const w=p.asset==='hotel'?115:p.asset==='exchange'?128:p.asset==='steakhouse'?88:p.asset==='mansion'?95:70;const depth=p.asset==='hotel'?110:p.asset==='exchange'?110:p.asset==='steakhouse'?108:p.asset==='mansion'?94:66;box(g,w,.6,depth,mats.stone,0,-.1,0);const rim=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w,.65,depth)),new THREE.LineBasicMaterial({color:0xe4c483}));rim.position.y=-.08;g.add(rim);bases.set(p.id,{g,rim});}
function updateBuildingState(p){const o=bases.get(p.id);if(o)o.rim.material.color.set(save.props[p.id].level?0x80e6b2:0xe4c483)}
const assetFiles={hotel:'hotel.glb',steakhouse:'steakhouse.glb',exchange:'exchange.glb',coffee:'coffee.glb',mansion:'mansion.glb'};const loader=new GLTFLoader();let finished=0;
function placeholder(p){const g=bases.get(p.id).g;const fallback=new THREE.Group();fallback.userData.propertyId=p.id;g.add(fallback);const h=p.asset==='hotel'?58:p.asset==='exchange'?22:p.asset==='mansion'?12:p.asset==='steakhouse'?16:9;const w=p.asset==='hotel'?65:p.asset==='exchange'?85:p.asset==='mansion'?65:50;box(fallback,w,h,w*.8,mats.stone,0,h/2,0,true);box(fallback,w*.8,h*.65,w*.81,mats.glass,0,h*.53,0);box(fallback,w+2,1,w*.85,mats.dark,0,h+.5,0);rayObjects.push(fallback);objects.set(p.id,fallback)}
async function loadAsset(name){return new Promise((resolve,reject)=>{let settled=false;const timeout=setTimeout(()=>{if(!settled){settled=true;reject(new Error('Asset timeout: '+name))}},7500);loader.load('models/'+assetFiles[name],g=>{if(settled)return;settled=true;clearTimeout(timeout);resolve(g.scene)},undefined,e=>{if(settled)return;settled=true;clearTimeout(timeout);reject(e)})})}
// Draw the city immediately, and never block gameplay on a failed asset request.
for(const p of properties)updateBuildingState(p);
Promise.allSettled(Object.keys(assetFiles).map(async name=>{try{const source=await loadAsset(name);assetCache.set(name,source);for(const p of properties.filter(q=>q.asset===name)){const g=source.clone(true);g.scale.set(p.x<0?-p.scale:p.scale,p.scale,p.scale);g.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=true;o.userData.propertyId=p.id}});bases.get(p.id).g.add(g);objects.set(p.id,g);rayObjects.push(g)}}catch(e){console.warn('Asset unavailable:',name,e);for(const p of properties.filter(q=>q.asset===name))placeholder(p)}finally{finished++;$('loadfill').style.width=finished/5*100+'%';$('loadingText').textContent='Preparing architecture '+finished+' / 5'}})).then(()=>{hideLoading();if(finished===5&&assetCache.size<5)toast('Some 3D models were unavailable; backup buildings are visible.')});
function hideLoading(){$('loading').style.display='none'}setTimeout(hideLoading,8200);
// Clickable HTML labels project into the fixed camera, so they work even when a model fails.
const labelEls=new Map();for(const p of properties){const el=document.createElement('button');el.className='pin';el.setAttribute('aria-label','View '+p.name);el.onclick=()=>showProperty(p);$('labels').append(el);labelEls.set(p.id,el)}
// Small tappable property markers: pricing and upgrades belong in the sheet, not over the buildings.
const pos=new THREE.Vector3();function updateLabels(){
 for(const p of properties){
  const el=labelEls.get(p.id);if(!el)continue;
  const state=save.props[p.id],owned=state.level>0;
  el.classList.toggle('owned',owned);
  el.textContent=owned?'✓':'+';
  el.title=p.name+' — '+(owned?'Level '+state.level:'Buy '+money(p.cost));
  const y=p.asset==='hotel'?112:p.asset==='exchange'?36:p.asset==='mansion'?21:p.asset==='steakhouse'?24:17;
  pos.set(p.x,y,p.z).project(camera);
  const px=(pos.x+1)*.5*innerWidth,py=(-pos.y+1)*.5*innerHeight;
  el.style.left=px+'px';el.style.top=py+'px';
  el.style.display=pos.z>1||px<14||px>innerWidth-14||py<155||py>innerHeight-92?'none':'flex';
 }
}
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let startX=0,startY=0;renderer.domElement.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY});renderer.domElement.addEventListener('pointerup',e=>{if(Math.hypot(e.clientX-startX,e.clientY-startY)>12)return;pointer.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(rayObjects,true)[0];if(hit){let obj=hit.object;while(obj&&!obj.userData.propertyId)obj=obj.parent;const p=properties.find(p=>p.id===obj?.userData.propertyId);if(p)showProperty(p)}});
// Deterministic traffic keeps the city alive without affecting the locked camera.
const traffic=[];function car(x,z,dir,color){const g=new THREE.Group();g.position.set(x,.55,z);g.rotation.y=dir;world.add(g);const paint=material(color,.25,.3);box(g,3,.8,6,paint,0,.5,0);box(g,2.4,.9,3,mats.glass,0,1.25,-.3);for(const sx of [-1.45,1.45])for(const sz of [-1.8,1.8]){const wheel=cyl(g,.62,.62,.32,mats.dark,sx,.3,sz,10);wheel.rotation.z=Math.PI/2}return g}
for(let i=0;i<8;i++){const z=-198+i*48;for(const side of [-1,1]){const g=car(side*309,z,side===1?Math.PI:0,['#f6efe1','#182a38','#cb443b','#e6b35a'][i%4]);traffic.push({g,phase:i*48,speed:7+i*.3})}}
// Autosave every tick, credit up to four hours of real offline income.
let last=Date.now();
function creditElapsed(now,announce=false){
 const dt=Math.min(Math.max(0,now-last),MAX_OFFLINE_MS);last=now;
 if(dt>0){const earned=perMin()*dt/60000;save.cash+=earned;save.lifetime+=earned;
 if(announce&&dt>15000&&earned>0)toast('WELCOME BACK · Offline earnings '+money(earned));}
 save.last=now;refresh();persist();
}
// Credit previously saved elapsed time once, never twice.
last=save.last;
creditElapsed(Date.now(),true);
setInterval(()=>{if(document.visibilityState==='visible')creditElapsed(Date.now())},1000);
addEventListener('pagehide',()=>creditElapsed(Date.now()));

const clock=new THREE.Clock();let lastLabelUpdate=0;
function frame(){requestAnimationFrame(frame);if(document.visibilityState==='hidden')return;
 const t=clock.getElapsedTime();for(const v of traffic)v.g.position.z=((v.phase+t*v.speed+225)%450)-225;
 if(t-lastLabelUpdate>.15){updateLabels();lastLabelUpdate=t}renderer.render(scene,camera)}frame();

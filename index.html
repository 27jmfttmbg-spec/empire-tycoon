<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#79d7ff"><meta name="apple-mobile-web-app-capable" content="yes"><title>Empire Tycoon · Cartoon City V6</title><style>
:root{--ink:#263552;--blue:#388de8;--sky:#a7e6ff;--cream:#fff9ec;--pink:#ff77a8;--gold:#ffc84b;--green:#39c88c;--shadow:#26355222}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:linear-gradient(#85d6ff 0,#dcf7ff 55%,#fff3db 100%);font-family:ui-rounded,'Arial Rounded MT Bold',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;touch-action:manipulation}#app{max-width:600px;margin:auto;padding:12px 13px 110px;min-height:100dvh}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:3px 0 10px}.logo{font-size:23px;font-weight:1000;letter-spacing:-1px;color:#21446f;text-shadow:2px 2px #fff}.logo small{font-size:10px;background:#ffdf61;border:2px solid #2e4661;border-radius:99px;padding:3px 7px;vertical-align:middle;letter-spacing:0}.round{border:3px solid #304766;background:#fff;border-radius:14px;box-shadow:0 4px 0 #304766;height:42px;width:42px;font-size:22px}.hud{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:7px}.stat{border:2.5px solid #334766;border-radius:16px;background:#fff;box-shadow:0 4px 0 #334766;padding:9px 7px;min-width:0}.stat small{display:block;font-size:10px;font-weight:900;color:#64758b}.stat strong{font-size:clamp(12px,3.8vw,19px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:4px}.stat:first-child{background:#fff3bc}.headline{margin:16px 2px 10px;display:flex;align-items:center;justify-content:space-between}.headline h2{font-size:21px;margin:0;font-weight:1000;letter-spacing:-.5px}.pill{background:#fff;border:2px solid #344e69;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:900}.panel{background:#fffdf5;border:3px solid #344967;border-radius:22px;box-shadow:0 6px 0 #344967;margin:13px 0;padding:15px}.panel h3{margin:0 0 8px;font-size:18px}.muted{color:#61728b;font-size:12px;line-height:1.5}.btn{border:2.5px solid #304765;background:#fff;border-radius:14px;box-shadow:0 4px 0 #304765;color:#273b5a;padding:10px 13px;font-size:13px;font-weight:1000;min-height:43px}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #304765}.btn.main{background:#ffcb51}.btn.green{background:#6fe0a3}.btn.pink{background:#ff9fc2}.btn:disabled{opacity:.5;filter:grayscale(.5)}.btn.wide{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions .btn{flex:1}.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;background:#fffdf4;border-top:3px solid #344967;padding:8px 6px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -5px 22px #3047651b}.navin{width:min(600px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav button{border:0;border-radius:13px;background:transparent;font-weight:900;font-size:10px;color:#60708a;padding:7px 2px}.nav button b{display:block;font-size:23px;margin-bottom:2px}.nav button.on{background:#ffdd7a;color:#273b5a;box-shadow:inset 0 -3px #eab957}.city{border:3px solid #304765;border-radius:24px;overflow:hidden;background:linear-gradient(#7dd3ff,#d3f6ff 65%,#9ed76d 65%);box-shadow:0 7px 0 #304765;position:relative}.city svg{width:100%;height:auto;display:block}.lot{cursor:pointer}.lot:active{opacity:.65}.lot text{pointer-events:none}.town-footer{background:#eafbd4;padding:10px;text-align:center;font-size:12px;font-weight:900;border-top:3px solid #304765}.quest{background:#fff0b3;border:3px solid #304765;border-radius:18px;box-shadow:0 5px 0 #304765;padding:12px 14px;margin:15px 0}.quest small{font-weight:1000;color:#976516}.quest strong{display:block;margin:4px 0;font-size:15px}.meter{height:11px;background:#e7e4da;border:2px solid #344967;border-radius:30px;overflow:hidden;margin:9px 0}.meter i{display:block;background:#51d894;height:100%;transition:width .3s}.tile{background:#fff;border:2.5px solid #334967;border-radius:18px;padding:12px;margin:10px 0;box-shadow:0 4px 0 #334967}.tile .emoji{font-size:40px;background:#ecf7ff;border:2px solid #bdd9e9;border-radius:16px;display:grid;place-items:center;width:72px;height:72px;flex-shrink:0}.tile h3{margin:0 0 4px;font-size:16px}.tile p{font-size:12px;color:#62738a;margin:3px 0}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tiles .tile{margin:0}.tiles .emoji{width:100%;height:95px;font-size:55px;margin-bottom:9px;background:linear-gradient(145deg,#a7e7ff,#fff0bb)}.tiles h3{font-size:14px}.price{font-weight:1000;color:#168a66}.owned{color:#267ec7;font-size:11px;font-weight:900}.characters{display:flex;align-items:end;justify-content:center;gap:0;height:146px;margin:5px auto 0}.person{width:120px;height:138px;position:relative;text-align:center;filter:drop-shadow(0 4px 0 #243e5940)}.person .face{font-size:77px;line-height:1.1}.person .name{font-size:12px;background:#fff;border:2px solid #344967;border-radius:99px;padding:3px 9px;display:inline-block;font-weight:1000}.person.speak{transform:translateY(-8px)}.bubble{background:#fff;border:3px solid #344967;border-radius:20px;padding:14px;box-shadow:0 5px 0 #344967;margin:10px 0;font-size:15px;line-height:1.5;font-weight:700}.choice{width:100%;text-align:left;display:flex;gap:10px;align-items:center;border:2.5px solid #344967;border-radius:16px;background:#fff;box-shadow:0 4px 0 #344967;padding:12px;margin:10px 0;color:#263b59;font-size:13px;font-weight:900}.choice span{display:grid;place-items:center;flex-shrink:0;width:30px;height:30px;background:#ffe58a;border-radius:10px}.choice:active{transform:translateY(3px);box-shadow:0 1px 0 #344967}.dialogue{position:fixed;inset:0;background:#28456bc7;z-index:40;display:flex;align-items:center;justify-content:center;padding:13px}.dialogue .paper{width:min(500px,100%);max-height:95dvh;overflow-y:auto;border:4px solid #344967;background:#fff8e8;border-radius:26px;padding:17px;box-shadow:0 9px 0 #1d3450}.dialogue h2{text-align:center;margin:5px 0;font-size:22px}.dialogue .hint{text-align:center;color:#7b8290;font-size:12px}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);max-width:92vw;z-index:100;background:#fff1aa;border:3px solid #344967;box-shadow:0 5px 0 #344967;border-radius:15px;padding:12px 16px;font-size:13px;font-weight:900}.float{position:absolute;pointer-events:none;z-index:10;font-size:17px;font-weight:1000;color:#138e58;animation:fly 1.1s forwards;text-shadow:2px 2px #fff}@keyframes fly{to{transform:translateY(-55px);opacity:0}}.event{display:flex;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid #e5e8e9;font-size:12px}.event:last-child{border:0}.mini{font-size:11px;color:#6b7c8e}.spark{display:inline-block;animation:bob 2s infinite ease-in-out}@keyframes bob{50%{transform:translateY(-5px)}}.help{line-height:1.7;font-size:13px}.stockchart{height:70px;display:flex;gap:4px;align-items:end}.stockchart i{flex:1;background:#7cd6a2;border:2px solid #318b71;border-radius:5px 5px 0 0}.lock{opacity:.7}@media(min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}.logo{font-size:27px}}
</style></head><body><div id="app"></div><nav class="nav"><div class="navin" id="nav"></div></nav><div id="dialogue"></div><div id="toasts"></div><script>
(()=>{'use strict';
const KEY='empire-cartoon-v6';const industries=[{id:'lawn',name:'Lawn Care',icon:'🌳',price:1800,profit:180,kind:'🏡',color:'#66c77b'},{id:'coffee',name:'Coffee Shop',icon:'☕',price:8000,profit:700,kind:'🏪',color:'#f6ae6d'},{id:'wash',name:'Car Wash',icon:'🚙',price:18000,profit:1450,kind:'🏭',color:'#76c6f1'},{id:'pizza',name:'Pizza Place',icon:'🍕',price:36000,profit:2850,kind:'🏬',color:'#fba1a1'},{id:'gym',name:'Fitness Club',icon:'🏋️',price:85000,profit:6400,kind:'🏢',color:'#9f8ee9'},{id:'tech',name:'Tech Studio',icon:'💻',price:230000,profit:18500,kind:'🏙️',color:'#70b7dc'}];
const properties=[{id:'cottage',name:'Cozy Cottage',icon:'🏡',price:12000,rent:115},{id:'duplex',name:'Sunny Duplex',icon:'🏘️',price:68000,rent:710},{id:'villa',name:'Beach Villa',icon:'🏖️',price:320000,rent:3600},{id:'tower',name:'Skyline Tower',icon:'🏙️',price:1900000,rent:26000}];
const cars=[{id:'mini',name:'City Hatchback',icon:'🚗',price:12000,upkeep:40},{id:'sports',name:'Sport Coupe',icon:'🏎️',price:85000,upkeep:340},{id:'super',name:'Supercar',icon:'🏁',price:360000,upkeep:1200},{id:'lux',name:'Luxury SUV',icon:'🚙',price:155000,upkeep:560}];
const stocks=[{id:'GROW',name:'GreenTech',icon:'🌱',base:125},{id:'FOOD',name:'FoodCo',icon:'🍔',base:62},{id:'AUTO',name:'AutoWorks',icon:'🏎️',base:215},{id:'CLOUD',name:'Cloud Labs',icon:'☁️',base:88}];
const scenarios=[{speaker:'maya',title:'First Day!',q:'Maya: We have $15,000 to build something great. Jordan says we should be careful. What should we do?',choices:[{label:'Start small with a lawn-care business',cash:-1800,biz:'lawn',rep:6,note:'Great! Our first customers are already calling. We kept an emergency fund.'},{label:'Spend $13,000 on a grand opening party',cash:-13000,rep:2,note:'People loved the party, but we have almost no money to run the company.'},{label:'Borrow $25,000 and open a coffee shop',cash:17000,debt:25000,biz:'coffee',rep:0,note:'We opened fast, but the loan will cost us every month.'}]},{speaker:'jordan',title:'The First Challenge',q:'Jordan: Our first customer is unhappy. A fix costs $400. What do we do?',choices:[{label:'Fix it properly and earn trust',cash:-400,rep:12,note:'The customer leaves a five-star review. Word of mouth helps business.'},{label:'Offer a $150 refund',cash:-150,rep:3,note:'The customer accepts, but our service reputation barely improves.'},{label:'Ignore the complaint',rep:-23,note:'Bad reviews spread. Future customers become harder to attract.'}]},{speaker:'maya',title:'Growth Opportunity',q:'Maya: We can grow quickly, but Jordan warns our cash reserves are thin. What is your move?',choices:[{label:'Save cash and build steadily',rep:5,note:'A steady approach keeps the company resilient.'},{label:'Run a $4,000 ad campaign',cash:-4000,rep:9,note:'The marketing campaign brings attention, but it was expensive.'},{label:'Take a $20,000 expansion loan',cash:20000,debt:20000,rep:-2,note:'The bank approves the loan. Interest payments are now a monthly expense.'}]}];
function fresh(){return {cash:15000,debt:0,rep:65,month:1,biz:{},props:{},cars:{},shares:{},prices:Object.fromEntries(stocks.map(x=>[x.id,x.base])),market:1,events:['Welcome to your new business adventure!'],story:0,storyDone:false,decisions:0,bankrupt:false,last:Date.now(),autoProgress:0,quests:0}}
let s;try{s=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'null')||{});}catch(e){s=fresh()}s.biz||={};s.props||={};s.cars||={};s.shares||={};s.prices||=Object.fromEntries(stocks.map(x=>[x.id,x.base]));s.events||=[];
let tab='city',dialog='',selected=null;const fmt=n=>{let a=Math.abs(n),v=a>=1e9?(a/1e9).toFixed(2)+'B':a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e3?(a/1e3).toFixed(a>=100000?0:1)+'K':Math.round(a).toLocaleString();return (n<0?'−':'')+'$'+v};const nfmt=n=>Math.round(n).toLocaleString();const safe=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{s.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};
const bizCount=()=>Object.values(s.biz).reduce((a,b)=>a+b.count,0);const gross=()=>industries.reduce((a,b)=>a+(s.biz[b.id]?.count||0)*b.profit*(1+(s.biz[b.id]?.level||0)*.32),0);const rental=()=>properties.reduce((a,p)=>a+(s.props[p.id]||0)*p.rent,0);const upkeep=()=>cars.reduce((a,c)=>a+(s.cars[c.id]||0)*c.upkeep,0);const loanCost=()=>s.debt*.012;const monthly=()=>Math.round((gross()*s.market*(.55+s.rep/200)+rental()-upkeep()-loanCost()));const worth=()=>Math.round(s.cash-s.debt+industries.reduce((a,b)=>a+(s.biz[b.id]?.count||0)*b.price*(1+(s.biz[b.id]?.level||0)*.5),0)+properties.reduce((a,p)=>a+(s.props[p.id]||0)*p.price,0)+cars.reduce((a,c)=>a+(s.cars[c.id]||0)*c.price*.82,0)+stocks.reduce((a,c)=>a+(s.shares[c.id]||0)*s.prices[c.id],0));
function event(msg){s.events.unshift('Month '+s.month+': '+msg);s.events=s.events.slice(0,18)}function toast(msg){const e=document.createElement('div');e.className='toast';e.textContent=msg;document.getElementById('toasts').append(e);setTimeout(()=>e.remove(),2700)}function enough(v){if(s.cash<v){toast('💸 Not enough cash!');return false}return true}
function month(){if(!s.storyDone||s.bankrupt)return;s.month++;const drift=(Math.random()-.48)*.12;s.market=Math.max(.65,Math.min(1.38,s.market+drift));for(const st of stocks){const old=s.prices[st.id];s.prices[st.id]=Math.max(4,Math.round(old*(1+(Math.random()-.49)*.17)))}const profit=monthly();s.cash+=profit;s.debt=Math.max(0,s.debt);const surprises=['Local demand is picking up! 📈','A competitor opened nearby. 🏬','Customers are spending cautiously. 🛍️','Your neighborhood is getting popular! 🎉'];if(s.month%3===0){const change=Math.round((Math.random()-.55)*1300);s.cash+=change;event(surprises[Math.floor(Math.random()*surprises.length)]+' '+(change>=0?'Bonus '+fmt(change):'Extra expense '+fmt(-change)))}event('Monthly cash flow: '+fmt(profit));if(s.cash< -12000){s.bankrupt=true;dialog='bankrupt';event('Your company ran out of money.')}save();render();if(profit>0&&Math.random()<.45)toast('💰 '+fmt(profit)+' earned this month!')}
function buyBusiness(id){const b=industries.find(x=>x.id===id),owned=s.biz[id]?.count||0,cost=Math.round(b.price*(1+owned*.38));if(!enough(cost))return;s.cash-=cost;s.biz[id]||={count:0,level:0};s.biz[id].count++;s.rep=Math.min(100,s.rep+1);event('Opened '+b.name+' for '+fmt(cost));save();render();toast('🎉 New '+b.name+'!')}
function upgrade(id){const b=industries.find(x=>x.id===id),obj=s.biz[id];if(!obj)return;const cost=Math.round(b.price*(.48+obj.level*.42));if(!enough(cost))return;s.cash-=cost;obj.level++;event('Upgraded '+b.name+' to level '+(obj.level+1));save();render();toast('⬆️ Business upgraded!')}
function buyProperty(id){const p=properties.find(x=>x.id===id);if(!enough(p.price))return;s.cash-=p.price;s.props[id]=(s.props[id]||0)+1;event('Bought '+p.name);save();render();toast('🏡 Property purchased!')}
function buyCar(id){const c=cars.find(x=>x.id===id);if(!enough(c.price))return;s.cash-=c.price;s.cars[id]=(s.cars[id]||0)+1;event('Added '+c.name+' to your garage');save();render();toast('🚘 New car unlocked!')}
function buyStock(id){const price=s.prices[id],q=5;if(!enough(price*q))return;s.cash-=price*q;s.shares[id]=(s.shares[id]||0)+q;event('Bought 5 '+id+' shares');save();render();toast('📈 Bought 5 shares!')}
function sellStock(id){if((s.shares[id]||0)<5){toast('You need 5 shares to sell');return}s.shares[id]-=5;s.cash+=s.prices[id]*5;event('Sold 5 '+id+' shares');save();render()}
function cashflow(){return `<div class="hud"><div class="stat"><small>💰 CASH</small><strong id="cash">${fmt(s.cash)}</strong></div><div class="stat"><small>🏆 NET WORTH</small><strong>${fmt(worth())}</strong></div><div class="stat"><small>📈 / MONTH</small><strong style="color:${monthly()>=0?'#168f68':'#da4862'}">${fmt(monthly())}</strong></div></div>`}
function quest(){const tasks=[{label:'Open your first business',done:()=>bizCount()>0,where:'business'},{label:'Earn your first $1,000 in monthly profit',done:()=>monthly()>=1000,where:'business'},{label:'Buy your first property',done:()=>Object.values(s.props).some(Boolean),where:'assets'},{label:'Invest in the stock market',done:()=>Object.values(s.shares).some(Boolean),where:'invest'},{label:'Build an empire worth $1 million',done:()=>worth()>=1e6,where:'city'}];const q=tasks.find(t=>!t.done());return `<div class="quest"><small>⭐ YOUR NEXT MISSION</small><strong>${q?q.label:'🏆 You completed every mission!'}</strong><div class="meter"><i style="width:${tasks.filter(t=>t.done()).length/tasks.length*100}%"></i></div><div class="row"><span class="mini">${tasks.filter(t=>t.done()).length} of ${tasks.length} missions</span>${q?`<button class="btn" onclick="game.go('${q.where}')">Let's go →</button>`:'<span>🎉 Champion!</span>'}</div></div>`}
function buildingSvg(x,y,id,kind,color,label,owned){const w=88,h=owned?68:34;let roof=owned?`<rect x="12" y="-15" width="64" height="18" rx="6" fill="#ffe0a1" stroke="#354b68" stroke-width="3"/>`:`<path d="M5 5 L44 -23 L83 5 Z" fill="#e2e9e9" stroke="#354b68" stroke-width="3"/>`;let windows=owned?`<rect x="16" y="18" width="17" height="20" rx="4" fill="#fff0a5" stroke="#354b68" stroke-width="2"/><rect x="55" y="18" width="17" height="20" rx="4" fill="#fff0a5" stroke="#354b68" stroke-width="2"/>`:`<rect x="32" y="9" width="24" height="25" rx="5" fill="#b8cbd0" stroke="#354b68" stroke-width="2"/>`;return `<g class="lot" onclick="game.lot('${id}')" transform="translate(${x},${y})"><ellipse cx="44" cy="${h+5}" rx="52" ry="15" fill="#355e5a33"/><rect x="0" y="0" width="88" height="${h}" rx="8" fill="${owned?color:'#e4eceb'}" stroke="#354b68" stroke-width="3"/>${roof}${windows}<rect x="35" y="${h-25}" width="20" height="25" rx="4" fill="${owned?'#ffdf83':'#a8bbc3'}" stroke="#354b68" stroke-width="2"/><text x="44" y="${owned?-24:-27}" text-anchor="middle" font-size="20">${owned?kind:'🔒'}</text><rect x="-6" y="${h+13}" width="100" height="22" rx="11" fill="#fff" stroke="#354b68" stroke-width="2"/><text x="44" y="${h+28}" text-anchor="middle" fill="#263552" font-size="10" font-weight="900">${safe(label)}</text></g>`}
function city(){let plots=[...industries.slice(0,6).map((b,i)=>({id:b.id,kind:b.kind,color:b.color,label:b.name,owned:(s.biz[b.id]?.count||0)>0})),...properties.slice(0,3).map(p=>({id:p.id,kind:p.icon,color:'#ffc5ab',label:p.name,owned:(s.props[p.id]||0)>0}))];let lots=plots.map((b,i)=>buildingSvg(32+(i%3)*120,110+Math.floor(i/3)*139,b.id,b.kind,b.color,b.label,b.owned)).join('');return `<div class="headline"><h2>🏙️ Your Happy Town</h2><span class="pill">Month ${s.month}</span></div><div class="city"><svg viewBox="0 0 420 560" role="img" aria-label="Cartoon town with tappable businesses and properties"><defs><pattern id="grass" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="2" fill="#78c65d"/></pattern></defs><circle cx="355" cy="63" r="38" fill="#ffe373" stroke="#fff4ba" stroke-width="7"/><path d="M0 105 Q65 55 140 104 T290 93 T420 110 V560 H0" fill="#92d47d"/><rect y="105" width="420" height="455" fill="url(#grass)"/><path d="M0 218 H420 M0 357 H420 M0 495 H420" stroke="#a3aeb6" stroke-width="25"/><path d="M0 218 H420 M0 357 H420 M0 495 H420" stroke="#f6f2e3" stroke-width="3" stroke-dasharray="12 12"/>${lots}<g transform="translate(12,12)"><rect width="145" height="36" rx="18" fill="#fff" stroke="#344967" stroke-width="3"/><text x="72" y="23" font-size="14" font-weight="900" text-anchor="middle" fill="#344967">🌈 EMPIRE CITY</text></g></svg><div class="town-footer">👆 Tap any building to buy or manage it!</div></div>${quest()}<div class="panel"><h3>💸 Your money works for you!</h3><p class="muted">Your businesses earn money automatically while you play. Every <b>45 seconds</b>, the game advances one month. No tapping for cash.</p><div class="row"><span class="pill" id="timer">Next month: 45s</span><button class="btn main" onclick="game.next()">⏩ Skip to next month</button></div></div>`}
function business(){return `<div class="headline"><h2>🏪 Open Businesses</h2><span class="pill">${bizCount()} locations</span></div><p class="muted">Pick a business, watch it grow, and earn money every month. Start with Lawn Care!</p>${industries.map(b=>{const o=s.biz[b.id],cnt=o?.count||0,cost=Math.round(b.price*(1+cnt*.38));return `<div class="tile"><div class="row"><div class="row" style="justify-content:start"><div class="emoji">${b.icon}</div><div><h3>${b.name}</h3><p>${cnt?'🏅 '+cnt+' locations · Level '+(o.level+1):'New business!'}</p><p class="price">${fmt(b.profit*(1+(o?.level||0)*.32))} / month per location</p></div></div></div><div class="actions"><button class="btn main" onclick="game.buyBiz('${b.id}')">${cnt?'➕ Another location':'🏪 Open'} · ${fmt(cost)}</button>${cnt?`<button class="btn green" onclick="game.upgrade('${b.id}')">⬆️ Upgrade · ${fmt(Math.round(b.price*(.48+o.level*.42)))}</button>`:''}</div></div>`}).join('')}`}
function assets(){return `<div class="headline"><h2>🏡 Property World</h2><span class="pill">${Object.values(s.props).reduce((a,b)=>a+b,0)} owned</span></div><p class="muted">Every property earns rent automatically each month. See your buildings in the city!</p><div class="tiles">${properties.map(p=>`<div class="tile"><div class="emoji">${p.icon}</div><h3>${p.name}</h3><p class="price">${fmt(p.price)}</p><p>💵 +${fmt(p.rent)} rent / month</p><p class="owned">${s.props[p.id]||0} owned</p><button class="btn main wide" onclick="game.buyProp('${p.id}')">Buy Property</button></div>`).join('')}</div><div class="headline"><h2>🚘 Dream Garage</h2></div><div class="tiles">${cars.map(c=>`<div class="tile"><div class="emoji">${c.icon}</div><h3>${c.name}</h3><p class="price">${fmt(c.price)}</p><p>Maintenance: ${fmt(c.upkeep)}/mo</p><p class="owned">${s.cars[c.id]||0} in garage</p><button class="btn pink wide" onclick="game.buyCar('${c.id}')">Buy Car</button></div>`).join('')}</div>`}
function invest(){return `<div class="headline"><h2>📈 Stock Market</h2><span class="pill">Simulated prices</span></div><p class="muted">Buy 5 shares at a time. Prices change every month—some investments gain value, others lose.</p>${stocks.map(st=>{const price=s.prices[st.id],owned=s.shares[st.id]||0;return `<div class="tile"><div class="row"><div class="row" style="justify-content:start"><div class="emoji">${st.icon}</div><div><h3>${st.name}</h3><p>${st.id} · ${owned} shares owned</p></div></div><div style="text-align:right"><b>${fmt(price)}</b><div class="mini">per share</div></div></div><div class="actions"><button class="btn green" onclick="game.buyStock('${st.id}')">Buy 5 · ${fmt(price*5)}</button><button class="btn" onclick="game.sellStock('${st.id}')">Sell 5</button></div></div>`}).join('')}`}
function office(){return `<div class="headline"><h2>🏢 CEO Office</h2><span class="pill">Reputation ${s.rep}/100</span></div><div class="panel"><div class="characters"><div class="person"><div class="face">👩🏽‍💼</div><div class="name">Maya · Partner</div></div><div class="person"><div class="face">👨🏽‍💻</div><div class="name">Jordan · Finance</div></div></div><h3 style="text-align:center">Your executive team</h3><p class="muted" style="text-align:center">They'll help you make smart decisions and avoid bankruptcy.</p><button class="btn main wide" onclick="game.advice()">💬 Ask for advice</button></div><div class="panel"><h3>📊 Company Report</h3>${[['Business income',fmt(gross()*s.market*(.55+s.rep/200))],['Property rent',fmt(rental())],['Car expenses','−'+fmt(upkeep())],['Loan interest','−'+fmt(loanCost())],['Monthly cash flow',fmt(monthly())],['Outstanding loans',fmt(s.debt)]].map(([a,b])=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #e4e7e6"><span class="muted">${a}</span><b>${b}</b></div>`).join('')}</div><div class="panel"><h3>🏦 Bank</h3><p class="muted">Borrowing gives you more cash today, but interest reduces your monthly profit.</p><div class="actions"><button class="btn" onclick="game.loan()">Borrow $10K</button><button class="btn green" onclick="game.repay()">Repay $5K</button></div></div><div class="panel"><h3>📰 Recent Events</h3>${s.events.slice(0,6).map(e=>`<div class="event"><span>📌</span><span>${safe(e)}</span></div>`).join('')}</div><button class="btn wide" onclick="game.help()">❔ How to Play</button><button class="btn wide" style="margin-top:10px" onclick="game.restart()">🔄 Start a new game</button>`}
function render(){document.getElementById('app').innerHTML=`<div class="top"><div class="logo">🌟 EMPIRE TYCOON <small>V6</small></div><button class="round" onclick="game.help()" aria-label="Help">❔</button></div>${cashflow()}${({city,business,assets,invest,office})[tab]()}<p style="text-align:center;font-size:11px;color:#5e7892;margin:25px 0">CARTOON CITY EDITION · AUTOSAVES ON THIS DEVICE</p>`;document.getElementById('nav').innerHTML=[['city','🏙️','City'],['business','🏪','Shops'],['assets','🏡','Assets'],['invest','📈','Stocks'],['office','💼','Office']].map(([id,icon,name])=>`<button class="${tab===id?'on':''}" onclick="game.go('${id}')"><b>${icon}</b>${name}</button>`).join('');renderDialogue();tickUI()}
function renderDialogue(){const e=document.getElementById('dialogue');if(!dialog){e.innerHTML='';return}if(dialog==='bankrupt'){e.innerHTML=`<div class="dialogue"><div class="paper"><div class="characters"><div class="person"><div class="face">😰</div><div class="name">Maya</div></div><div class="person"><div class="face">😓</div><div class="name">Jordan</div></div></div><h2>💥 Bankruptcy!</h2><div class="bubble">Jordan: We ran out of money. Every choice matters, but we can try again!</div><button class="btn main wide" onclick="game.restart(true)">🔄 Try again</button></div></div>`;return}if(dialog==='result'){e.innerHTML=`<div class="dialogue"><div class="paper"><div class="characters"><div class="person"><div class="face">👩🏽‍💼</div><div class="name">Maya</div></div><div class="person"><div class="face">👨🏽‍💻</div><div class="name">Jordan</div></div></div><h2>${s.storyDone?'🎉 You are the CEO!':'Decision made!'}</h2><div class="bubble">${safe(window._result||'Great decision!')}</div><div class="row" style="margin:14px 0"><span class="pill">Cash ${fmt(s.cash)}</span><span class="pill">Debt ${fmt(s.debt)}</span></div><button class="btn main wide" onclick="game.continueStory()">${s.storyDone?'🏙️ Enter my city!':'Next chapter →'}</button></div></div>`;return}if(dialog==='story'){const sc=scenarios[s.story];e.innerHTML=`<div class="dialogue"><div class="paper"><div class="row"><span class="pill">📖 CHAPTER ${s.story+1} / ${scenarios.length}</span><span class="pill">${sc.title}</span></div><div class="characters"><div class="person ${sc.speaker==='maya'?'speak':''}"><div class="face">👩🏽‍💼</div><div class="name">Maya · Partner</div></div><div class="person ${sc.speaker==='jordan'?'speak':''}"><div class="face">👨🏽‍💻</div><div class="name">Jordan · Finance</div></div></div><div class="bubble">${safe(sc.q)}</div><p class="hint">Choose carefully. Money, debt and reputation matter!</p>${sc.choices.map((c,i)=>`<button class="choice" onclick="game.choose(${i})"><span>${String.fromCharCode(65+i)}</span>${safe(c.label)}</button>`).join('')}</div></div>`;return}if(dialog==='advice'){e.innerHTML=`<div class="dialogue"><div class="paper"><div class="characters"><div class="person"><div class="face">👩🏽‍💼</div><div class="name">Maya</div></div><div class="person"><div class="face">👨🏽‍💻</div><div class="name">Jordan</div></div></div><h2>💬 CEO Advice</h2><div class="bubble">${monthly()<0?'Jordan: Our expenses are higher than our income! Reduce debt and buy profitable businesses.':s.cash<5000?'Jordan: We are running low on cash. Keep a safety buffer before expanding.':'Maya: We are doing well! Consider opening another business or buying a rental property.'}</div><button class="btn main wide" onclick="game.dismiss()">Got it!</button></div></div>`;return}if(dialog==='help'){e.innerHTML=`<div class="dialogue"><div class="paper"><h2>🎮 How to Play</h2><div class="help"><p>🏙️ <b>City:</b> Tap buildings to buy or manage them.</p><p>🏪 <b>Shops:</b> Open businesses and upgrade them for more income.</p><p>🏡 <b>Assets:</b> Buy rental properties and collect cars.</p><p>📈 <b>Stocks:</b> Buy and sell simulated investments.</p><p>💼 <b>Office:</b> Check your finances and manage debt.</p><p>💰 <b>Automatic income:</b> Each in-game month lasts 45 seconds. No tapping needed. Income and costs are added automatically. Your progress saves on this device.</p><p>⚠️ <b>Bankruptcy:</b> If your cash falls below −$12,000, you lose.</p></div><button class="btn main wide" onclick="game.dismiss()">Let's play!</button></div></div>`}}
function storyChoose(i){const sc=scenarios[s.story],c=sc.choices[i];s.cash+=c.cash||0;s.debt+=c.debt||0;s.rep=Math.max(0,Math.min(100,s.rep+(c.rep||0)));if(c.biz){s.biz[c.biz]||={count:0,level:0};s.biz[c.biz].count++}s.story++;s.storyDone=s.story>=scenarios.length;window._result=c.note;event(c.note);dialog='result';save();render()}
function tickUI(){const el=document.getElementById('timer');if(el)el.textContent='⏱️ Next month: '+Math.max(1,Math.ceil((45000-s.autoProgress)/1000))+'s';const cash=document.getElementById('cash');if(cash)cash.textContent=fmt(s.cash)}
window.game={go:t=>{tab=t;render();scrollTo(0,0)},lot:id=>{if(industries.some(b=>b.id===id)){tab='business'}else{tab='assets'}render();toast('👆 Find '+(industries.find(b=>b.id===id)?.name||properties.find(p=>p.id===id)?.name)+' below!');scrollTo(0,0)},buyBiz:buyBusiness,upgrade,buyProp:buyProperty,buyCar,buyStock,sellStock,next:month,choose:storyChoose,continueStory:()=>{dialog=s.storyDone?'':'story';render()},dismiss:()=>{dialog='';render()},help:()=>{dialog='help';render()},advice:()=>{dialog='advice';render()},loan:()=>{s.debt+=10000;s.cash+=10000;event('Borrowed $10,000');save();render();toast('🏦 Loan approved!')},repay:()=>{if(s.debt<=0){toast('No debt to repay');return}const amt=Math.min(5000,s.debt);if(!enough(amt))return;s.debt-=amt;s.cash-=amt;save();render();toast('💚 Loan payment made!')},restart:force=>{if(!force&&!confirm('Start over? Your cartoon game progress will be erased.'))return;s=fresh();dialog='story';tab='city';save();render()}};
// Offline progress is capped to prevent unrealistic idle jumps. Story starts on first play.
const away=Math.max(0,Date.now()-(s.last||Date.now()));if(s.storyDone&&!s.bankrupt&&away>60000){const missed=Math.min(12,Math.floor(away/45000));for(let i=0;i<missed;i++){s.month++;s.cash+=monthly()}if(missed)event('Welcome back! Earned '+fmt(missed*monthly())+' while away.')}s.autoProgress=0;dialog=s.bankrupt?'bankrupt':(!s.storyDone?'story':'');save();render();setInterval(()=>{if(!s.storyDone||s.bankrupt)return;s.autoProgress+=1000;if(s.autoProgress>=45000){s.autoProgress=0;month()}else tickUI();if(s.autoProgress%5000===0)save()},1000);
})();</script></body></html>

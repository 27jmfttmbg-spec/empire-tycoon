<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101719"><title>EMPIRE | Signature Residence</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#9cb7c4;color:#fff;font-family:Arial,Helvetica,sans-serif}canvas{display:block;touch-action:none}.hud{position:fixed;z-index:5;top:0;left:0;right:0;padding:20px 21px;background:linear-gradient(#0c1824ba,transparent);pointer-events:none}.eyebrow{font-size:10px;letter-spacing:4px;color:#d6c2a2}.title{font-size:20px;font-weight:300;letter-spacing:3px;margin-top:7px}.sub{font-size:11px;letter-spacing:2px;margin-top:6px;color:#f1eee5}.controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5;max-width:98vw;flex-wrap:wrap;justify-content:center}.controls button.active{background:#d7b889;color:#17232a;border-color:#e8d6b9}.controls button{border:1px solid #ffffff80;border-radius:3px;background:#0e1b22c9;color:#fff;padding:11px 10px;font-size:10px;letter-spacing:1.5px}.hint{position:fixed;bottom:145px;text-align:center;left:0;right:0;font-size:11px;letter-spacing:1px;text-shadow:0 2px 8px #000}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#152229;color:#f1e6d3;z-index:10;letter-spacing:3px;font-size:13px}.loading[hidden]{display:none}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><div id="loading" class="loading">PREPARING RESIDENCE...</div><div class="hud"><div class="eyebrow">EMPIRE TYCOON · PRIVATE COLLECTION</div><div class="title">OBSIDIAN RIVERFRONT</div><div class="sub">DOWNTOWN · SHOPS · RIVERWALK</div></div><div class="hint">DRAG TO EXPLORE · PINCH TO ZOOM</div><div class="controls"><button id="district">CITY</button><button id="street">STREET</button><button id="riverwalk">RIVERWALK</button><button id="skyline">SKYLINE</button><button id="front">ESTATE</button><button id="rear">POOL TERRACE</button><button id="aerial">AERIAL</button><button id="daylight">DAY</button><button id="golden">GOLDEN</button><button id="dusk">DUSK</button></div><script type="module">import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const loading=document.getElementById('loading');const fail=(msg)=>{loading.hidden=false;loading.style.letterSpacing='1px';loading.style.padding='30px';loading.style.textAlign='center';loading.style.lineHeight='1.7';loading.textContent=msg;};window.addEventListener('error',e=>fail('VIEWER ERROR: '+e.message));window.addEventListener('unhandledrejection',e=>fail('LOAD ERROR: '+String(e.reason)));setTimeout(()=>{if(!loading.hidden)fail('STILL LOADING. Check that mansion.glb, city.glb and downtown.glb are uploaded alongside index.html and open the GitHub Pages URL in Safari.');},12000);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fc3dc);scene.fog=new THREE.FogExp2(0xb5cddd,0.00085);
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{topColor:{value:new THREE.Color(0x397bad)},horizonColor:{value:new THREE.Color(0xdbeaf2)},bottomColor:{value:new THREE.Color(0xf5e6d2)}},vertexShader:`varying vec3 vWorld;void main(){vec4 w=modelMatrix*vec4(position,1.);vWorld=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,fragmentShader:`varying vec3 vWorld;uniform vec3 topColor;uniform vec3 horizonColor;uniform vec3 bottomColor;void main(){float h=normalize(vWorld).y;vec3 c=mix(bottomColor,horizonColor,smoothstep(-0.24,0.05,h));c=mix(c,topColor,smoothstep(0.01,0.86,h));gl_FragColor=vec4(c,1.);}`});
const sky=new THREE.Mesh(new THREE.SphereGeometry(1300,32,20),skyMat);sky.position.y=-20;scene.add(sky);const camera=new THREE.PerspectiveCamera(44,innerWidth/innerHeight,.1,1800);camera.position.set(45,29,-57);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,4,0);controls.enableDamping=true;controls.dampingFactor=.07;controls.maxPolarAngle=Math.PI/2.08;controls.minDistance=13;controls.maxDistance=950;const hemi=new THREE.HemisphereLight(0xdcecff,0x6e7878,1.35);scene.add(hemi);const sun=new THREE.DirectionalLight(0xfff0d5,2.5);sun.position.set(-65,85,-45);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.radius=3;sun.shadow.camera.left=-310;sun.shadow.camera.right=510;sun.shadow.camera.top=310;sun.shadow.camera.bottom=-310;sun.shadow.bias=-.00025;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(2500,2500),new THREE.MeshStandardMaterial({color:0x869c92,roughness:.93}));ground.rotation.x=-Math.PI/2;ground.position.y=-.85;ground.receiveShadow=true;scene.add(ground);const loader=new GLTFLoader();
Promise.all(['./mansion.glb','./city.glb','./downtown.glb'].map(path=>new Promise((resolve,reject)=>loader.load(path,g=>resolve(g.scene),undefined,reject)))).then(([estate,city,downtown])=>{for(const root of [estate,city,downtown]){root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});scene.add(root);}loading.hidden=true;setView('street');}).catch(e=>{fail('MODEL LOAD ERROR: '+(e?.message||e)+' — Upload index.html, mansion.glb, city.glb and downtown.glb to the same GitHub folder.');});
// Legible street-level shop signage. Rendered as textures on 3D facade planes.
const shopNames=['BELLWETHER COFFEE','RIVER & RYE','ATELIER','CINDER STEAKHOUSE','THE BOOK ROOM'];
const shopNames2=['MERCANTILE','FLORIST','HOTEL OBSIDIAN','SUSHI KAI','THE CELLAR'];
function makeSign(label,x,z){
 const canvas=document.createElement('canvas');canvas.width=1024;canvas.height=128;
 const ctx=canvas.getContext('2d');ctx.fillStyle='#151c20';ctx.fillRect(0,0,1024,128);

}
for(let i=0;i<5;i++){makeSign(shopNames[i],500+i*21,-47);makeSign(shopNames2[i],500+i*21,-106);}
const palettes={

golden:{sun:0xffbb77,skyTop:0x456c9a,horizon:0xffc48e,bottom:0xffa67d,fog:0xe1b9a5,ground:0x8d8b79,exposure:1.0,intensity:3.1,ambient:1.05,sunpos:[-90,32,-55]},
dusk:{sun:0xff9e6d,skyTop:0x192b5b,horizon:0xb57a9c,bottom:0xf3a77f,fog:0x7e819a,ground:0x687781,exposure:.87,intensity:1.4,ambient:1.0,sunpos:[-85,15,-50]}};
function setLight(mode){const p=palettes[mode];sun.color.setHex(p.sun);sun.intensity=p.intensity;sun.position.set(...p.sunpos);hemi.intensity=p.ambient;renderer.toneMappingExposure=p.exposure;skyMat.uniforms.topColor.value.setHex(p.skyTop);skyMat.uniforms.horizonColor.value.setHex(p.horizon);skyMat.uniforms.bottomColor.value.setHex(p.bottom);scene.fog.color.setHex(p.fog);ground.material.color.setHex(p.ground);document.querySelectorAll('.controls button').forEach(b=>b.classList.toggle('active',b.id===mode));}
for(const mode of Object.keys(palettes))document.getElementById(mode).onclick=()=>setLight(mode);setLight('golden');
const views={street:[[530,13,0],[535,6,-45]],riverwalk:[[540,15,122],[540,8,47]],skyline:[[658,145,145],[545,34,-75]],district:[[290,135,225],[240,28,-55]],front:[[45,26,-54],[0,4,0]],rear:[[37,23,57],[0,4,9]],aerial:[[45,76,-60],[0,0,0]]};function setView(v){camera.position.set(...views[v][0]);controls.target.set(...views[v][1]);controls.update()}for(const id of Object.keys(views))document.getElementById(id).onclick=()=>setView(id);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera)}frame();</script><script>setTimeout(()=>{const l=document.getElementById("loading");if(l&&!l.hidden&&l.textContent==="PREPARING RESIDENCE...")l.textContent="ENGINE DID NOT START. Check Safari connection to jsDelivr or JavaScript module support."},14000)</script></body></html>

<script type="module">

$('close').onclick=()=>{$('card').style.display='none';selected=null};$('portfolio').onclick=()=>{const el=$('catalog');el.style.display=el.style.display==='block'?'none':'block';const list=$('catalogitems');list.innerHTML='';for(const d of defs){const p=save.props[d.id],b=document.createElement('button');b.innerHTML='<b>'+d.name+'</b><small>'+(p.owned?'OWNED · LVL '+p.level+' · +'+fmt(income(d))+'/min':'FOR SALE · '+fmt(d.cost))+'</small>';b.onclick=()=>{showCard(d);focus(d)};list.append(b)}};
const scene=new THREE.Scene();scene.background=new THREE.Color('#a8d7e8');scene.fog=new THREE.FogExp2('#a8d7e8',.00115);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.65));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;$('scene').appendChild(renderer.domElement);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,1,1800);camera.position.set(305,295,360);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,5,0);controls.enableDamping=true;controls.dampingFactor=.075;controls.maxPolarAngle=Math.PI/2.13;controls.minPolarAngle=.17;controls.minDistance=35;controls.maxDistance=760;controls.enablePan=true;controls.screenSpacePanning=false;controls.panSpeed=.75;controls.touches.ONE=THREE.TOUCH.ROTATE;controls.touches.TWO=THREE.TOUCH.DOLLY_PAN;

box(560,1,510,grass,0,-2,0);box(570,.6,93,water,0,-2.3,-304);box(570,.4,18,walk,0,-1.6,-249);box(550,.12,20,road,0,-1.25,-19);box(22,.12,475,road,-33,-1.23,0);box(530,.12,17,road,0,-1.2,234);box(18,.12,475,road,266,-1.2,0);box(18,.12,475,road,-267,-1.2,0);
for(let x=-252;x<260;x+=16){box(7,.04,.25,white,x,-1.12,-19);box(7,.04,.25,white,x,-1.12,234)}for(let z=-230;z<230;z+=16){box(.25,.04,7,white,-33,-1.1,z)}
// Symmetric planted promenade and subtle street lighting.
function palm(x,z,s=1){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.34*s,.57*s,9*s,7),mat('#886d4d'));trunk.position.set(x,4.5*s-1.5,z);scene.add(trunk);const crown=new THREE.Group();crown.position.set(x,9*s-1.5,z);for(let i=0;i<9;i++){const a=i*Math.PI*2/9;const leaf=new THREE.Mesh(new THREE.ConeGeometry(1.6*s,8*s,5),treeGreen);leaf.rotation.z=Math.PI/2.9;leaf.rotation.y=a;leaf.position.set(Math.sin(a)*2.8*s,-.45*s,Math.cos(a)*2.8*s);crown.add(leaf)}scene.add(crown)}

const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2(),clickTargets=[],models=new Map(),markers=new Map();
function marker(d){const canvas=document.createElement('canvas');canvas.width=512;canvas.height=128;const c=canvas.getContext('2d');c.fillStyle='#102630e8';c.beginPath();c.roundRect(6,7,500,112,24);c.fill();c.strokeStyle='#e9c981';c.lineWidth=5;c.stroke();c.fillStyle='#f8ebd1';c.font='bold 30px system-ui';c.textAlign='center';c.fillText(d.name,256,53);c.fillStyle=save.props[d.id].owned?'#75efb0':'#f0ce83';c.font='bold 23px system-ui';c.fillText(save.props[d.id].owned?'OWNED · LEVEL '+save.props[d.id].level:'BUY '+fmt(d.cost),256,91);const t=new THREE.CanvasTexture(canvas);t.colorSpace=THREE.SRGBColorSpace;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));sp.position.set(d.x,d.id==='hotel'?113:d.id==='mansion'?20:d.id==='exchange'?34:d.id==='steakhouse'?27:15,d.z);sp.scale.set(64,16,1);sp.userData.property=d;scene.add(sp);clickTargets.push(sp);markers.set(d.id,sp)}

const loader=new GLTFLoader();let loaded=0;async function loadModel(d){try{const gltf=await loader.loadAsync('models/'+d.id+'.glb');const obj=gltf.scene;obj.position.set(d.x,0,d.z);obj.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=true;o.userData.property=d}});scene.add(obj);models.set(d.id,obj);clickTargets.push(obj)}catch(e){console.error('Could not load '+d.id,e);box(d.size*.65,3,d.size*.65,walk,d.x,0,d.z);toast('Some models could not load. Use a web host.')}finally{loaded++;$('fill').style.width=(loaded/defs.length*100)+'%';$('loadingText').textContent='Loading '+loaded+' of '+defs.length+' luxury properties';}}

function setNight(on){night=on;save.night=night;scene.background=new THREE.Color(on?'#101d32':'#a8d7e8');scene.fog.color.set(on?'#101d32':'#a8d7e8');sun.intensity=on?.5:3;hemi.intensity=on?.8:2.2;renderer.toneMappingExposure=on?.95:1.25;$('day').textContent=on?'☾ NIGHT MODE':'☀ DAYLIGHT';state()}$('day').onclick=()=>setNight(!night);setNight(night);
let downX=0,downY=0;renderer.domElement.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY;animating=false},{passive:true});renderer.domElement.addEventListener('pointerup',e=>{if(Math.hypot(e.clientX-downX,e.clientY-downY)>9)return;const rect=renderer.domElement.getBoundingClientRect();mouse.set(((e.clientX-rect.left)/rect.width)*2-1,-((e.clientY-rect.top)/rect.height)*2+1);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(clickTargets,true);for(const hit of hits){let o=hit.object;while(o&&!o.userData.property)o=o.parent;if(o?.userData.property){showCard(o.userData.property);return}}},{passive:true});

<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090f17"><title>EMPIRE — Tycoon</title><style>
:root{--bg:#090f17;--panel:#121c29;--panel2:#172535;--line:#26374a;--muted:#8595a9;--white:#f1f7fb;--mint:#47e5a5;--gold:#f5c56b;--red:#f57882}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--white);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}body{min-height:100dvh}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.975)}button:disabled{opacity:.38;cursor:not-allowed}.shell{max-width:540px;margin:auto;padding:0 17px 110px}.top{display:flex;justify-content:space-between;align-items:center;padding:20px 0 19px}.brand{display:flex;gap:10px;align-items:center;font-weight:900;letter-spacing:3px;font-size:18px}.brandmark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#4fe8ac,#17785f);color:#05150e;font-size:22px}.level{font-size:10px;color:var(--gold);letter-spacing:1.3px;font-weight:800}.iconbtn{background:#1b2a3a;border:1px solid var(--line);color:#e9f2f9;width:38px;height:38px;border-radius:12px}.hero{position:relative;overflow:hidden;border:1px solid #2b4c4d;border-radius:24px;padding:23px;background:radial-gradient(ellipse at 85% 0%,#21564c 0,transparent 60%),linear-gradient(135deg,#1a3236,#111d2b 72%);box-shadow:0 20px 55px #0005}.hero:after{content:'◆';position:absolute;right:-20px;top:20px;font-size:150px;color:#ffffff08;transform:rotate(25deg)}.eyebrow{color:#b7c8d0;font-size:11px;letter-spacing:2px;font-weight:800}.net{font-size:clamp(33px,9vw,48px);font-weight:850;letter-spacing:-2px;margin:8px 0}.gain{font-size:12px;color:var(--mint);font-weight:750}.herofoot{display:flex;gap:10px;margin-top:23px}.herobox{flex:1;padding:12px;border-radius:13px;background:#ffffff0b;border:1px solid #ffffff16}.herobox small{display:block;color:#9bb3b9;font-size:10px;margin-bottom:5px}.herobox strong{font-size:17px}.sectiontop{display:flex;align-items:center;justify-content:space-between;margin:25px 0 12px}.sectiontop h2{font-size:17px;margin:0;letter-spacing:-.4px}.sectiontop span{color:var(--muted);font-size:11px}.card{background:linear-gradient(150deg,var(--panel),#111925);border:1px solid var(--line);border-radius:19px;padding:17px;margin:11px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.label{color:var(--muted);font-size:12px}.money{font-weight:800;font-variant-numeric:tabular-nums}.mint{color:var(--mint)}.gold{color:var(--gold)}.red{color:var(--red)}.mini{font-size:11px}.muted{color:var(--muted)}.title{font-size:16px;font-weight:800;letter-spacing:-.3px}.sub{color:var(--muted);font-size:11px;margin-top:4px;line-height:1.5}.bizicon{height:45px;width:45px;border-radius:14px;background:linear-gradient(140deg,#254e52,#183040);display:grid;place-items:center;font-size:24px;flex:none}.bizline{display:flex;align-items:center;gap:11px}.bizline>div:nth-child(2){flex:1}.pill{background:#173c36;color:var(--mint);border-radius:30px;font-size:10px;font-weight:800;padding:6px 9px;white-space:nowrap}.btn{border:0;border-radius:12px;padding:12px 15px;font-size:12px;font-weight:800;background:#27394c;color:#eef6fa}.btn.main{background:linear-gradient(130deg,#52e9ad,#22b58c);color:#07221b}.btn.alt{background:#263447}.btn.goldbtn{background:linear-gradient(135deg,#f8d58a,#db9c3b);color:#352207}.btn.wide{width:100%}.buttons{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.buttons>*{flex:1}.divider{height:1px;background:var(--line);margin:13px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.stat{background:#ffffff07;border:1px solid #ffffff0c;border-radius:11px;padding:10px}.stat small{color:var(--muted);display:block;font-size:10px;margin-bottom:4px}.stat b{font-size:13px}.work{border:1px solid #467c66;background:radial-gradient(ellipse at 80% 20%,#236348,#173a36 65%,#173034);border-radius:19px;padding:19px;display:flex;align-items:center;justify-content:space-between;gap:10px}.work h3{margin:0;font-size:18px}.work p{font-size:11px;color:#b4d0c6;margin:5px 0 0}.tap{height:67px;width:67px;border-radius:20px;border:1px solid #b8ffe1;background:linear-gradient(135deg,#73f5bf,#2cc58f);color:#083523;font-size:26px;font-weight:900;box-shadow:0 7px 25px #43e6a44a}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0d1620f2;backdrop-filter:blur(22px);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom));z-index:5}.nav{max-width:540px;margin:auto;display:flex;justify-content:space-around;gap:2px}.nav button{background:transparent;border:0;color:#7f90a2;display:grid;place-items:center;gap:4px;min-width:0;flex:1;padding:6px 0;font-size:9px;font-weight:750}.nav button .ico{font-size:21px}.nav button.active{color:var(--mint)}.bar{height:6px;border-radius:9px;background:#263343;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#1cbd8b,#83f7c9);border-radius:9px}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:8;background:#294337;border:1px solid #57b38b;padding:11px 17px;border-radius:12px;color:#eafff3;box-shadow:0 12px 35px #0008;font-size:12px;font-weight:750;max-width:90vw;text-align:center;pointer-events:none}.chart{width:100%;height:92px;margin:12px 0 0}.headrow{display:flex;justify-content:space-between;align-items:center;margin:12px 0}.progress{background:#243447;border-radius:9px;height:8px;overflow:hidden}.progress div{height:100%;background:var(--gold)}.badge{font-size:10px;color:var(--gold);font-weight:800}.empty{text-align:center;padding:30px 10px;color:var(--muted)}.empty strong{color:var(--white);display:block;margin:8px}.footnote{color:#6f8090;font-size:10px;text-align:center;margin:25px 0}.overlay{position:fixed;inset:0;background:#000b;z-index:9;display:grid;place-items:center;padding:22px}.modal{background:#182638;border:1px solid #3c566c;border-radius:22px;padding:23px;width:min(100%,400px)}.modal h2{margin:0 0 8px}.modal p{color:#a9b9ca;font-size:13px;line-height:1.6}.hidden{display:none!important} .shine{animation:shine .25s ease}@keyframes shine{50%{filter:brightness(1.4)}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><span class="brandmark">◆</span><span>EMPIRE</span></div><div style="text-align:right"><div class="level" id="rank">STARTER</div><div class="mini muted">BUSINESS TYCOON</div></div></header><section class="hero"><div class="eyebrow">TOTAL NET WORTH</div><div class="net" id="net">$500</div><div class="gain" id="rate">↗ +$0 / second</div><div class="herofoot"><div class="herobox"><small>AVAILABLE CASH</small><strong id="cash">$500</strong></div><div class="herobox"><small>ASSETS OWNED</small><strong id="assets">0</strong></div></div></section><div id="view"></div><div class="footnote">Original fictional simulation · Progress saved on this device</div></main><footer class="bottom"><nav class="nav" id="nav"></nav></footer><div id="toast" class="toast hidden"></div><div id="modal" class="overlay hidden"></div><script>
(()=>{'use strict';const KEY='empire_tycoon_elite_v1';const D=[['lawn','Lawn Care','🌿',650,1.5,.22,6],['coffee','Coffee House','☕',3500,7,1.1,12],['retail','Retail Empire','🛍️',16000,32,5.2,18],['agency','Media Agency','📡',85000,170,28,28],['tech','Tech Startup','💠',480000,950,150,45],['factory','Industrial Group','🏭',3000000,6200,1000,65],['air','Airline Network','✈️',22000000,49000,8500,100],['space','Space Ventures','🚀',200000000,480000,80000,150]];const P=[['Starter Home','🏡',16000,1.5],['Downtown Condos','🏙️',130000,17],['Office Tower','🏢',1450000,205],['Island Resort','🏝️',17000000,2600]];const S=[['NOVA','Technology',95],['VOLT','Energy',47],['CROWN','Finance',180],['AERO','Transport',76]];const R=[['GreenEdge Group','🌱',14000,5],['Brew Collective','☕',85000,36],['Apex Retail','🛒',500000,220],['Titan Holdings','🏛️',9000000,4800],['Orbit Industries','🪐',90000000,51000]];const L=[['Luxury Watch','⌚',12500],['Supercar','🏎️',250000],['Superyacht','🛥️',8500000],['Private Jet','🛩️',47000000]];const initial=()=>({cash:500,earned:0,clicks:0,biz:{},properties:[],stocks:[0,0,0,0],prices:S.map(x=>x[2]),history:S.map(x=>[x[2]]),rivals:[],lux:[],bank:0,last:Date.now(),marketAt:Date.now(),totalClicks:0});let g=initial(),page='home',timer=null;try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&typeof x.cash==='number'&&x.biz)g={...initial(),...x}}catch(e){}const $=id=>document.getElementById(id),fmt=n=>{const neg=n<0;n=Math.abs(n);let s=n>=1e12?(n/1e12).toFixed(2)+'T':n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(2)+'K':n<10?n.toFixed(2):n.toFixed(0);return(neg?'−':'')+'$'+s},safe=n=>Number.isFinite(n)?n:0,save=()=>{try{localStorage.setItem(KEY,JSON.stringify(g))}catch(e){}};const owned=d=>g.biz[d[0]],value=(d,b)=>d[3]*(1+.6*(b.level-1)+.11*b.staff),revenue=(d,b)=>d[4]*(1+.6*(b.level-1))*(1+.14*b.staff)*({lean:.82,balanced:1,expand:1.35}[b.strategy]||1),cost=(d,b)=>d[5]*(1+.32*(b.level-1))*({lean:.7,balanced:1,expand:1.8}[b.strategy]||1)+b.staff*(d[4]*.045),profit=(d,b)=>revenue(d,b)-cost(d,b),income=()=>D.reduce((a,d)=>a+(owned(d)?profit(d,owned(d)):0),0)+g.properties.reduce((a,i)=>a+P[i][3],0)+g.rivals.reduce((a,i)=>a+R[i][3],0)+g.bank*.0000015,worth=()=>g.cash+g.bank+D.reduce((a,d)=>a+(owned(d)?value(d,owned(d)):0),0)+g.properties.reduce((a,i)=>a+P[i][2],0)+g.rivals.reduce((a,i)=>a+R[i][2],0)+g.lux.reduce((a,i)=>a+L[i][2],0)+g.stocks.reduce((a,v,i)=>a+v*g.prices[i],0),assetCount=()=>Object.keys(g.biz).length+g.properties.length+g.rivals.length+g.lux.length;function update(){const now=Date.now(),delta=Math.min(14400,Math.max(0,(now-g.last)/1000));if(delta){const v=income()*delta;g.cash+=v;g.earned+=v;g.last=now}if(now-g.marketAt>9000){let steps=Math.min(100,Math.floor((now-g.marketAt)/9000));for(let j=0;j<steps;j++)g.prices=g.prices.map((p,i)=>{let next=Math.max(1,p*(1+(Math.random()-.49)*.085));g.history[i].push(next);g.history[i]=g.history[i].slice(-28);return next});g.marketAt=now}save()}function notify(t){const el=$('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>el.classList.add('hidden'),2200)}function buy(n){update();if(g.cash+1e-7<n){notify('Need '+fmt(n-g.cash)+' more cash');return false}g.cash-=n;return true}const button=(text,act,disabled=false,style='main')=>`<button class="btn ${style}" data-action="${act}" ${disabled?'disabled':''}>${text}</button>`,head=(title,detail='')=>`<div class="sectiontop"><h2>${title}</h2><span>${detail}</span></div>`,card=(inside)=>`<div class="card">${inside}</div>`,bizhead=(name,icon,desc,tag='')=>`<div class="bizline"><div class="bizicon">${icon}</div><div><div class="title">${name}</div><div class="sub">${desc}</div></div>${tag}</div>`,line=(a,b)=>`<div class="row mini" style="margin-top:10px"><span class="muted">${a}</span><strong>${b}</strong></div>`;function home(){const level=worth(),goal=level<1e4?1e4:level<1e5?1e5:level<1e6?1e6:level<1e9?1e9:1e12;const best=D.filter(d=>!owned(d)).slice(0,2);return `${head('Make your first million','THE JOURNEY')}<div class="work"><div><h3>Build your fortune</h3><p>Tap to earn ${fmt(50+Math.floor(g.clicks/30)*25)} per move</p></div><button class="tap" data-action="tap" aria-label="Earn money">＋</button></div>${head('Your next milestone',fmt(goal))}${card(`<div class="row"><strong class="gold">${goal===1e4?'First $10K':goal===1e5?'Six figures':goal===1e6?'Millionaire':goal===1e9?'Billionaire':'Trillionaire'}</strong><span class="mini muted">${Math.min(100,level/goal*100).toFixed(1)}%</span></div><div class="bar"><i style="width:${Math.min(100,level/goal*100)}%"></i></div>`)}${head('Your portfolio',`${assetCount()} assets`)}<div class="stats"><div class="stat"><small>PASSIVE PROFIT</small><b class="mint">${fmt(income())}/s</b></div><div class="stat"><small>LIFETIME EARNED</small><b>${fmt(g.earned)}</b></div><div class="stat"><small>COMPANIES</small><b>${Object.keys(g.biz).length}</b></div><div class="stat"><small>EMPLOYEES</small><b>${Object.values(g.biz).reduce((a,b)=>a+b.staff,0)}</b></div></div>${head('Next opportunities','GROW FASTER')}${best.map(d=>card(`${bizhead(d[1],d[2],`Generates ${fmt(d[4]-d[5])}/sec`)}<div class="buttons">${button('Acquire for '+fmt(d[3]),'buy:'+d[0],g.cash<d[3])}</div>`)).join('')}${card(`<div class="row"><div><div class="title">📈 Diversify your empire</div><div class="sub">Invest in markets, property and competitors.</div></div>${button('Explore','go:invest',false,'alt')}</div>`)}`}
function business(){let own=D.filter(d=>owned(d)),available=D.filter(d=>!owned(d));return `${head('My companies',`${own.length} owned`)}${own.length?own.map(d=>{let b=owned(d),p=profit(d,b),upgrade=d[3]*(.6+.5*(b.level-1)),hire=d[3]*.07+100;return card(`${bizhead(d[1],d[2],`Level ${b.level} · ${b.staff}/${d[6]} employees`,`<span class="pill">${fmt(p)}/s</span>`)}<div class="stats"><div class="stat"><small>REVENUE / SEC</small><b>${fmt(revenue(d,b))}</b></div><div class="stat"><small>EXPENSES / SEC</small><b class="red">${fmt(cost(d,b))}</b></div></div>${line('Business valuation',fmt(value(d,b)))}${line('Management strategy',b.strategy.toUpperCase())}<div class="buttons">${button('Upgrade '+fmt(upgrade),'upgrade:'+d[0],g.cash<upgrade)}${button('Hire '+fmt(hire),'hire:'+d[0],g.cash<hire||b.staff>=d[6],'alt')}</div><div class="buttons">${button('Change strategy','strategy:'+d[0],false,'alt')}${button('Fire employee','fire:'+d[0],b.staff===0,'alt')}</div>`)}).join(''):`<div class="empty">🏢<strong>Your empire starts here</strong>Acquire a company to start earning passive income.</div>`}${head('Business marketplace','ACQUISITIONS')}${available.map(d=>card(`${bizhead(d[1],d[2],`Starting profit ${fmt(d[4]-d[5])}/sec`)}${line('Acquisition price',fmt(d[3]))}<div class="buttons">${button('Acquire company','buy:'+d[0],g.cash<d[3])}</div>`)).join('')}`}
function graph(history){let mn=Math.min(...history),mx=Math.max(...history),range=mx-mn||1;let pts=history.map((v,i)=>`${(i/Math.max(1,history.length-1)*300).toFixed(1)},${(82-(v-mn)/range*70).toFixed(1)}`).join(' ');let up=history.at(-1)>=history[0];return `<svg class="chart" viewBox="0 0 300 90" preserveAspectRatio="none"><defs><linearGradient id="fade${up?'u':'d'}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${up?'#48e5a5':'#f57882'}" stop-opacity=".25"/><stop offset="1" stop-opacity="0"/></linearGradient></defs><polygon points="0,90 ${pts} 300,90" fill="url(#fade${up?'u':'d'})"/><polyline points="${pts}" stroke="${up?'#47e5a5':'#f57882'}" stroke-width="2.5" fill="none" vector-effect="non-scaling-stroke"/></svg>`}function investments(){return `${head('The stock exchange','LIVE SIMULATION')}${S.map((s,i)=>{const price=g.prices[i],h=g.history[i],change=(price/h[0]-1)*100;return card(`${bizhead(s[0],'📈',s[1],`<span class="${change>=0?'mint':'red'} mini">${change>=0?'+':''}${change.toFixed(1)}%</span>`)}${graph(h)}<div class="row"><div><div class="title">${fmt(price)}</div><div class="sub">${g.stocks[i]} shares · ${fmt(g.stocks[i]*price)} value</div></div><div class="buttons" style="margin:0">${button('Buy','stockbuy:'+i,g.cash<price)}${button('Sell','stocksell:'+i,g.stocks[i]===0,'alt')}</div></div>`)}).join('')}${head('Real estate','RENTAL INCOME')}${P.map((p,i)=>card(`${bizhead(p[0],p[1],`${fmt(p[3])}/sec rent`)}${line('Portfolio holdings',g.properties.filter(x=>x===i).length)}<div class="buttons">${button('Purchase · '+fmt(p[2]),'property:'+i,g.cash<p[2])}</div>`)).join('')}`}
function mergers(){return `${head('Corporate acquisitions','EXPAND YOUR REACH')}${card(`<div class="title gold">Become an industry titan</div><div class="sub">Buy competitors outright and receive their profits as subsidiaries. Every acquisition adds to your net worth.</div>`)}${R.map((r,i)=>card(`${bizhead(r[0],r[1],`Subsidiary income ${fmt(r[3])}/sec`,g.rivals.includes(i)?'<span class="pill">OWNED</span>':'')}${line('Market valuation',fmt(r[2]))}<div class="buttons">${g.rivals.includes(i)?'<span class="mint mini">✓ Integrated into your empire</span>':button('Acquire competitor','rival:'+i,g.cash<r[2],'goldbtn')}</div>`)).join('')}`}
function bank(){return `${head('Private banking','WEALTH MANAGEMENT')}${card(`<div class="eyebrow">SAVINGS BALANCE</div><div class="net" style="font-size:34px">${fmt(g.bank)}</div><div class="mint mini">Interest ${fmt(g.bank*.0000015)}/sec</div><div class="divider"></div><div class="buttons">${button('Deposit $1K','deposit:1000',g.cash<1000)}${button('Withdraw $1K','withdraw:1000',g.bank<1000,'alt')}</div><div class="buttons">${button('Deposit $10K','deposit:10000',g.cash<10000)}${button('Withdraw $10K','withdraw:10000',g.bank<10000,'alt')}</div>`)}${head('The luxury collection','PRESTIGE')}${L.map((l,i)=>card(`${bizhead(l[0],l[1],`Owned: ${g.lux.filter(x=>x===i).length}`)}<div class="buttons">${button('Purchase · '+fmt(l[2]),'lux:'+i,g.cash<l[2],'goldbtn')}</div>`)).join('')}${head('Game settings')}${card(`<div class="title">Local game save</div><div class="sub">Progress is automatically saved in this browser. Offline earnings are capped at 4 hours.</div><div class="buttons">${button('Reset game','reset',false,'alt')}</div>`)}`}
const pages=[['home','⌂','Home'],['business','▦','Companies'],['invest','⌁','Markets'],['mergers','♜','Mergers'],['bank','◈','Wealth']];function render(){update();$('net').textContent=fmt(worth());$('cash').textContent=fmt(g.cash);$('assets').textContent=assetCount();$('rate').textContent='↗ '+fmt(income())+' / second';let w=worth();$('rank').textContent=w>=1e9?'BILLIONAIRE':w>=1e6?'MILLIONAIRE':w>=1e5?'INVESTOR':w>=1e4?'ENTREPRENEUR':'STARTER';$('view').innerHTML=({home,business,invest:investments,mergers,bank})[page]();$('nav').innerHTML=pages.map(([id,icon,label])=>`<button data-action="go:${id}" class="${page===id?'active':''}"><span class="ico">${icon}</span>${label}</button>`).join('')}
function confirmReset(){$('modal').classList.remove('hidden');$('modal').innerHTML=`<div class="modal"><h2>Start a new empire?</h2><p>This permanently erases your current progress on this device.</p><div class="buttons">${button('Cancel','cancel',false,'alt')}${button('Erase progress','confirmreset',false,'goldbtn')}</div></div>`}document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const [act,id]=target.dataset.action.split(':');if(act==='go'){page=id;render();window.scrollTo({top:0,behavior:'smooth'});return}if(act==='reset'){confirmReset();return}if(act==='cancel'){$('modal').classList.add('hidden');return}if(act==='confirmreset'){g=initial();page='home';$('modal').classList.add('hidden');render();notify('A new empire begins');return}update();if(act==='tap'){let n=50+Math.floor(g.clicks/30)*25;g.cash+=n;g.earned+=n;g.clicks++;target.classList.remove('shine');void target.offsetWidth;target.classList.add('shine')}else if(act==='buy'){const d=D.find(x=>x[0]===id);if(d&&!owned(d)&&buy(d[3])){g.biz[id]={level:1,staff:0,strategy:'balanced'};notify(d[1]+' acquired!')}}else if(['upgrade','hire','fire','strategy'].includes(act)){const d=D.find(x=>x[0]===id),b=owned(d);if(!b)return;if(act==='upgrade'&&buy(d[3]*(.6+.5*(b.level-1)))){b.level++;notify('Business upgraded')}if(act==='hire'&&b.staff<d[6]&&buy(d[3]*.07+100)){b.staff++;notify('Employee hired')}if(act==='fire'&&b.staff>0){b.staff--;notify('Employee dismissed')}if(act==='strategy'){b.strategy={lean:'balanced',balanced:'expand',expand:'lean'}[b.strategy];notify('Strategy: '+b.strategy)}}else if(act==='stockbuy'){let i=+id;if(buy(g.prices[i]))g.stocks[i]++}else if(act==='stocksell'){let i=+id;if(g.stocks[i]>0){g.stocks[i]--;g.cash+=g.prices[i]}}else if(act==='property'){let i=+id;if(buy(P[i][2])){g.properties.push(i);notify('Property purchased')}}else if(act==='rival'){let i=+id;if(!g.rivals.includes(i)&&buy(R[i][2])){g.rivals.push(i);notify('Acquisition completed')}}else if(act==='lux'){let i=+id;if(buy(L[i][2])){g.lux.push(i);notify('Welcome to the luxury life')}}else if(act==='deposit'){let n=+id;if(buy(n))g.bank+=n}else if(act==='withdraw'){let n=+id;if(g.bank>=n){g.bank-=n;g.cash+=n}}save();render()});let offline=Math.min(14400,Math.max(0,(Date.now()-g.last)/1000))*income();render();if(offline>1)notify('Welcome back! Earned '+fmt(offline)+' offline');setInterval(()=>{if(!document.hidden)render()},1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});})();
</script></body></html>
